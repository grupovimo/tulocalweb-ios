openapi: 3.1.0
info:
  title: Tu Local Web
  version: 0.1.0
  description: |
    Contrato único entre el front (SvelteKit, BFF) y sus dos fuentes de datos: el sandbox de la
    demo (D1) y la API Go. Los casos de `casos/` corren contra las dos implementaciones.
    Montos en centavos (enteros). Fechas de negocio YYYY-MM-DD en hora de Argentina.
    Errores: application/problem+json.
paths:
  /v1/rubros:
    get:
      operationId: listarRubros
      summary: Rubros con su plantilla y tienda de ejemplo
      responses:
        '200':
          description: Rubros
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rubro' }
  /v1/auth/registro:
    post:
      operationId: registrar
      summary: Crea la cuenta, su tienda y la sesión (sigue en el onboarding)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Alta' }
      responses:
        '201': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/ingresar:
    post:
      operationId: ingresar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, clave]
              properties:
                email: { type: string }
                clave: { type: string }
                recordarme: { type: boolean }
      responses:
        '200': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '401': { description: 'Email o contraseña mal (`credenciales_invalidas`), con `restantes`: los intentos que quedan antes de pausar el ingreso de ese email 15 minutos (5 por ventana; se dice exista o no la cuenta)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/segundo-factor:
    post:
      operationId: completarSegundoFactor
      summary: 'Completa un ingreso con verificación en dos pasos: el desafío (segundoFactor del ingreso) y el código de la app autenticadora o uno de recuperación'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desafio, codigo]
              properties:
                desafio: { type: string }
                codigo: { type: string }
      responses:
        '200': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { description: 'Código incorrecto (cuenta como intento; 5 por desafío)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '401': { description: 'Desafío vencido o sin intentos (`desafio_vencido`): ingresar de nuevo', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '429': { $ref: '#/components/responses/Problema' }
    get:
      operationId: estadoSegundoFactor
      summary: Si la persona tiene prendida la verificación en dos pasos
      responses:
        '200': { description: Estado, content: { application/json: { schema: { $ref: '#/components/schemas/EstadoSegundoFactor' } } } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/auth/segundo-factor/activar:
    post:
      operationId: activarSegundoFactor
      summary: 'Un secreto nuevo (pendiente) y su otpauth:// para el QR; queda prendida al confirmar'
      responses:
        '200':
          description: Secreto
          content:
            application/json:
              schema:
                type: object
                required: [secreto, uri]
                properties:
                  secreto: { type: string, description: 'En base32, para cargarlo a mano' }
                  uri: { type: string }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/auth/segundo-factor/confirmar:
    post:
      operationId: confirmarSegundoFactor
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [codigo], properties: { codigo: { type: string } } } } } }
      responses:
        '200': { description: Prendida, con los códigos de recuperación, content: { application/json: { schema: { $ref: '#/components/schemas/CodigosRecuperacion' } } } }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/auth/segundo-factor/codigos:
    post:
      operationId: nuevosCodigosRecuperacion
      summary: Reemplaza los códigos de recuperación (pide un código)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [codigo], properties: { codigo: { type: string } } } } } }
      responses:
        '200': { description: Códigos nuevos, content: { application/json: { schema: { $ref: '#/components/schemas/CodigosRecuperacion' } } } }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/auth/segundo-factor/desactivar:
    post:
      operationId: desactivarSegundoFactor
      summary: Apaga la verificación en dos pasos (pide un código de la app o de recuperación)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [codigo], properties: { codigo: { type: string } } } } } }
      responses:
        '204': { description: Apagada }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/auth/proveedores:
    get:
      operationId: proveedores
      summary: Qué ingresos están prendidos. La app de iPhone saca de acá la clave publicable de Clerk.
      responses:
        '200':
          description: Proveedores
          content:
            application/json:
              schema:
                type: object
                required: [oauth, clerk, clerkPublicable, whatsapp]
                properties:
                  oauth: { type: array, items: { type: string }, description: 'mercadopago, mercadolibre' }
                  clerk: { type: boolean }
                  clerkPublicable: { type: string, description: 'pk_live_… de la instancia que verifica Go (vacía: Clerk apagado). Es pública' }
                  whatsapp: { type: boolean }
  /v1/auth/salir:
    post:
      operationId: salir
      responses:
        '204': { description: Sesión cerrada }
  /v1/auth/sesion:
    get:
      operationId: sesion
      responses:
        '200': { description: Sesión en curso, content: { application/json: { schema: { $ref: '#/components/schemas/DatosSesion' } } } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/auth/clerk:
    post:
      operationId: ingresarConClerk
      summary: Entra con el token de sesión de Clerk (Google, Apple). Lo usan la web (por el BFF) y la app de iPhone.
      description: |
        Clerk es la identidad compartida de Grupo Vimo: una sola instancia para todas las apps. El
        cliente completa el ingreso con Clerk (la web, con la Frontend API en modo nativo; la app de
        iPhone, con el SDK de Clerk para Swift) y manda acá el token de sesión de Clerk
        (`session.getToken()`, un JWT RS256 que vive 60 segundos): conviene pedirlo justo antes.

        Go no confía en nada del cliente: verifica la firma con las claves públicas de la instancia
        (JWKS), el emisor (`iss`, la Frontend API), el vencimiento y, si el token trae `azp` (el
        origen del navegador que lo pidió), que sea un origen permitido (`MOSTRADOR_CLERK_ORIGENES`).
        La app nativa no tiene origen: su token viene sin `azp` y se acepta. Después lee a la persona
        con la Backend API de Clerk (email verificado, nombre y foto).

        Si la identidad de Clerk ya está vinculada, entra a esa cuenta. Si no, la vincula a la cuenta
        de Tu Local Web con ese email (Clerk sólo da emails verificados) o crea una cuenta nueva, como
        el registro: tienda provisoria, mail de bienvenida y `nueva: true` para seguir al onboarding.

        La respuesta es la sesión propia de Tu Local Web. La web la guarda en la cookie
        `__Host-tlw_sesion`; la app de iPhone guarda `token` en el Keychain y lo manda como
        `Authorization: Bearer` en cada pedido. La sesión dura 30 días y es independiente de la de
        Clerk (cerrar una no cierra la otra).

        Límite: 30 intentos cada 15 minutos por IP (la del visitante si el pedido viene del BFF).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 8192, description: Token de sesión de Clerk (JWT) }
                invitacion: { type: string, maxLength: 200, description: 'Token de una invitación al equipo de una tienda: la cuenta (nueva o no) queda sumada a esa tienda y una cuenta nueva no crea otra tienda' }
      responses:
        '200': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/IngresoSocial' } } } }
        '401': { description: 'Token inválido o vencido (`clerk_token_invalido`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { description: 'Clerk apagado (`proveedor_apagado`) o la persona no tiene un email verificado (`sin_email`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/tiendas:
    get:
      operationId: acceso
      summary: La tienda que se está viendo, el rol y sus permisos, y todas las tiendas de la persona.
      responses:
        '200': { description: Acceso, content: { application/json: { schema: { $ref: '#/components/schemas/Acceso' } } } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/auth/tienda:
    put:
      operationId: elegirTienda
      summary: Cambia la tienda de la sesión (una persona con varias tiendas elige cuál ver).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [tiendaId], properties: { tiendaId: { type: string } } }
      responses:
        '204': { description: Cambiada }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/auth/invitacion:
    post:
      operationId: verInvitacion
      summary: Qué invitación es (tienda, rol, email) sin usarla. Va por POST para que el token no quede en logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { description: Invitación, content: { application/json: { schema: { $ref: '#/components/schemas/Invitacion' } } } }
        '422': { description: 'Venció, se canceló o ya se usó (`link_invalido`)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/auth/invitacion/aceptar:
    post:
      operationId: aceptarInvitacion
      summary: Suma a la persona de la sesión a la tienda de la invitación (un solo uso) y deja la sesión en esa tienda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { description: Sumada, content: { application/json: { schema: { type: object, required: [tiendaId], properties: { tiendaId: { type: string } } } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/auth/invitacion/registro:
    post:
      operationId: registrarConInvitacion
      summary: Crea la cuenta con el email de la invitación (sin tienda propia) y la suma a esa tienda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, nombre, clave]
              properties:
                token: { type: string }
                nombre: { type: string, maxLength: 80 }
                clave: { type: string, minLength: 8 }
      responses:
        '201': { description: Sesión, content: { application/json: { schema: { $ref: '#/components/schemas/Sesion' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { description: 'Ese email ya tiene cuenta (`email_en_uso`): que ingrese y acepte', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/auth/recuperar:
    post:
      operationId: recuperar
      summary: Manda el link para crear una contraseña nueva. Responde igual exista o no la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Recibido }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/auth/restablecer/verificar:
    post:
      operationId: verificarRestablecer
      summary: Si el link de contraseña nueva sigue sirviendo (no lo usa). Va por POST para que el token no quede en logs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: Sirve }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/auth/restablecer:
    post:
      operationId: restablecer
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, clave], properties: { token: { type: string }, clave: { type: string } } }
      responses:
        '204': { description: Contraseña cambiada; se cierran todas las sesiones }
        '400': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/arrepentimientos:
    post:
      operationId: pedirArrepentimiento
      summary: Botón de arrepentimiento (Res. 424/2020). Público, sin sesión; devuelve el código de trámite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoArrepentimiento' }
      responses:
        '201':
          description: Registrado; la confirmación sale por mail
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string, pattern: '^ARR-\d{4}-\d{6,}$' } } }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/contacto:
    post:
      operationId: consultar
      summary: Consulta de ventas (/contacto). Público, sin sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Consulta' }
      responses:
        '202': { description: Registrada; confirmación por mail }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/partners/postulaciones:
    post:
      operationId: postularPartner
      summary: Postulación al programa de partners. Repetir el email no es error.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Postulacion' }
      responses:
        '202': { description: Registrada }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo:
    get:
      operationId: panelPartner
      summary: El panel de partners de la persona de la sesión (/partners/panel). 404 si no es partner.
      responses:
        '200':
          description: Panel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelPartner' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo/perfil:
    put:
      operationId: guardarPerfilPartner
      summary: El perfil público que se ve en "Buscar un partner".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PerfilPartner' }
      responses:
        '200':
          description: Guardado (limpio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilPartner' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo/cobro:
    put:
      operationId: guardarCobroPartner
      summary: Datos de cobro (CBU/CVU o alias, titular, CUIT con verificador, condición frente al IVA).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CobroPartner' }
      responses:
        '200':
          description: Guardado (limpio)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CobroPartner' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/partners/yo/pagos/{mes}/factura:
    put:
      operationId: subirFacturaPartner
      summary: El link (https) de la factura del partner para un pago que todavía no se pagó.
      parameters:
        - { name: mes, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [url], properties: { url: { type: string, maxLength: 500 } } }
      responses:
        '204': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/partners/clics:
    post:
      operationId: sumarClicPartner
      summary: Un clic en el link de un partner (/empezar?ref=…). Sólo con la clave del BFF; un ref desconocido no hace nada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [ref], properties: { ref: { type: string, maxLength: 40 } } }
      responses:
        '204': { description: Contado (o ignorado) }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/interno/partners:
    post:
      operationId: aprobarPartner
      summary: 'Uso interno (backoffice, clave del BFF): convierte la cuenta del email en partner o le cambia el nivel.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
                nivel: { $ref: '#/components/schemas/NivelPartner' }
                nombre: { type: string, description: 'De la agencia; arma el link y el cupón' }
      responses:
        '200':
          description: Aprobado
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string } } }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/interno/partners/liquidaciones:
    post:
      operationId: liquidarPartner
      summary: 'Uso interno: arma (o rehace, si sigue pendiente) la liquidación de un mes.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, mes], properties: { email: { type: string }, mes: { type: string } } }
      responses:
        '200':
          description: Liquidación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagoPartner' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/interno/partners/pagos:
    put:
      operationId: estadoPagoPartner
      summary: 'Uso interno: pasa un pago a aprobada o pagada.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, mes, estado]
              properties:
                email: { type: string }
                mes: { type: string }
                estado: { type: string, enum: [aprobada, pagada] }
      responses:
        '204': { description: Cambiado }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/novedades/suscripciones:
    post:
      operationId: suscribirNovedades
      summary: Suma un email al resumen mensual de novedades.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string } } }
      responses:
        '202': { description: Suscripto (o ya lo estaba) }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/novedades/baja:
    post:
      operationId: bajaNovedades
      summary: Baja con el token del link del mail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: Dado de baja }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/panel/onboarding:
    get:
      operationId: leerOnboarding
      summary: Lo guardado del onboarding (para retomarlo en otro dispositivo) y si ya terminó.
      responses:
        '200':
          description: Onboarding
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Onboarding' }
        '401': { $ref: '#/components/responses/Problema' }
    put:
      operationId: guardarOnboarding
      summary: Guarda lo elegido en el onboarding (y si terminó). La plantilla pasa a ser la de la tienda.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Onboarding' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/resumen:
    get:
      operationId: resumenPanel
      summary: Lo que muestra el armazón del panel en cada pantalla (insignias del menú y notificaciones).
      responses:
        '200':
          description: Resumen
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumenPanel' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/tablero:
    get:
      operationId: tablero
      summary: El Resumen del panel (dashboard) para un período.
      parameters:
        - name: periodo
          in: query
          schema: { type: string, enum: [hoy, 7d, 30d], default: 7d }
      responses:
        '200':
          description: Tablero
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tablero' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/meta:
    put:
      operationId: guardarMeta
      summary: La meta de ventas del mes (en pesos; 0 la saca).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objetivo]
              properties:
                objetivo: { type: integer, minimum: 0, maximum: 100000000000 }
      responses:
        '204': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/avisos/{aviso}/ocultar:
    post:
      operationId: ocultarAviso
      summary: Descarta un aviso del Resumen (por ahora, el del certificado de ARCA).
      parameters:
        - { name: aviso, in: path, required: true, schema: { type: string, enum: [certificado] } }
      responses:
        '204': { description: Oculto }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/carritos/recordar:
    post:
      operationId: recordarCarritos
      summary: Manda por WhatsApp el recordatorio a los carritos abandonados recuperables.
      responses:
        '200':
          description: Cuántos mensajes quedaron en cola
          content:
            application/json:
              schema:
                type: object
                required: [enviados]
                properties:
                  enviados: { type: integer }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/hornero/contexto:
    get:
      operationId: contextoHornero
      summary: Lo que Hornero sabe de la tienda para responder (ventas por día, productos, clientes, pendientes).
      responses:
        '200':
          description: Contexto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextoHornero' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/hornero/ideas/{idea}:
    post:
      operationId: marcarIdea
      summary: Aprueba (o deshace) una idea de Hornero.
      parameters:
        - { name: idea, in: path, required: true, schema: { type: string, enum: [carritos, stock, promo] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hecha]
              properties:
                hecha: { type: boolean }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos:
    get:
      operationId: listarPedidos
      summary: Pedidos con filtros (en la URL del panel), conteos por etapa y facetas, y una ventana de filas.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: 'Cliente, número, producto o ciudad' }
        - { name: estado, in: query, schema: { type: string }, description: 'Separados por coma' }
        - { name: canal, in: query, schema: { type: string } }
        - { name: pago, in: query, schema: { type: string } }
        - { name: envio, in: query, schema: { type: string } }
        - { name: fecha, in: query, schema: { type: string, enum: [hoy, 7d, 30d, todo], default: todo } }
        - { name: minimo, in: query, schema: { type: integer, minimum: 0 } }
        - { name: vip, in: query, schema: { type: boolean } }
        - { name: hornero, in: query, schema: { type: boolean } }
        - { name: mayorista, in: query, schema: { type: boolean } }
        - { name: orden, in: query, schema: { type: string, enum: [nuevos, urgentes, monto, viejos], default: nuevos } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cuantos, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaPedidos' }
        '401': { $ref: '#/components/responses/Problema' }
    post:
      operationId: crearPedido
      summary: Un pedido nuevo (venta en el local o cargado a mano). Descuenta el stock.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoNuevo' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                required: [numero, total]
                properties:
                  numero: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/lote:
    post:
      operationId: pedidosEnLote
      summary: Acción sobre varios pedidos (preparar, etiquetas, facturar, avisar).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numeros, accion]
              properties:
                numeros: { type: array, maxItems: 500, items: { type: integer } }
                accion: { type: string, enum: [preparar, etiquetas, facturar, avisar] }
      responses:
        '200':
          description: Cuántos se pudieron hacer (los que no estaban en la etapa justa se saltean)
          content:
            application/json:
              schema:
                type: object
                required: [hechos, cambios]
                properties:
                  hechos: { type: integer }
                  cambios:
                    type: array
                    description: 'Para deshacer: número y estado anterior'
                    items:
                      type: object
                      required: [numero, antes]
                      properties:
                        numero: { type: integer }
                        antes: { $ref: '#/components/schemas/EstadoPedido' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}:
    get:
      operationId: obtenerPedido
      summary: El detalle de un pedido.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Pedido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoDetalle' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/estado:
    post:
      operationId: cambiarEstadoPedido
      summary: Avanza el pedido una etapa, lo vuelve una atrás (deshacer) o lo cancela.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoPedido' }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/saldado:
    post:
      operationId: saldarPedido
      summary: 'Con la seña pagada (§52): la tienda cobró el resto al entregarlo. El pago queda «Cobrado».'
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Saldado }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: desaldarPedido
      summary: 'Deshace «saldado»: el resto vuelve a quedar pendiente y el pago en «Seña».'
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Pendiente otra vez }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/recordatorio:
    post:
      operationId: recordarPago
      summary: Le manda al cliente un recordatorio de pago por WhatsApp.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: Enviado }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/listas/{lista}:
    get:
      operationId: listar
      summary: 'Motor de listas (Clientes, Productos, Inventario, Facturación, Envíos): filtros, conteos y una ventana de filas.'
      parameters:
        - { name: lista, in: path, required: true, schema: { $ref: '#/components/schemas/NombreLista' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: seg, in: query, schema: { type: string }, description: 'Segmentos, separados por coma' }
        - { name: facetas, in: query, schema: { type: string }, description: 'clave:valor separados por coma (ch:wa,city:Rosario)' }
        - { name: rango, in: query, schema: { type: integer, minimum: 0 } }
        - { name: banderas, in: query, schema: { type: string } }
        - { name: orden, in: query, schema: { type: string } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cuantos, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaGenerica' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/listas/{lista}/acciones:
    post:
      operationId: accionLista
      summary: Una acción sobre una o varias filas (o la sugerencia de Hornero de esa lista).
      parameters:
        - { name: lista, in: path, required: true, schema: { $ref: '#/components/schemas/NombreLista' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, accion]
              properties:
                ids: { type: array, maxItems: 500, items: { type: string } }
                accion: { type: string }
                valor: { description: 'Lo que la acción necesite (ajuste de stock, publicado…). Facturación: emitir lleva {cliente, tipo, cuit, concepto, total}; reintentar y anular (nota de crédito) usan ids.' }
      responses:
        '200':
          description: Cuántas filas cambiaron
          content:
            application/json:
              schema:
                type: object
                required: [hechos]
                properties:
                  hechos: { type: integer }
        '400': { $ref: '#/components/responses/Problema', description: 'Facturación: el error de ARCA o de los datos, para mostrar tal cual' }
        '401': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/productos:
    post:
      operationId: crearProducto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEditable' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/productos/{id}:
    get:
      operationId: obtenerProducto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Producto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    put:
      operationId: guardarProducto
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEditable' }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Producto' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/productos/{id}/lanzamiento:
    get:
      operationId: lanzamientoProducto
      summary: 'Lanzamiento, reserva y encargo con seña y oferta con fin del producto (§52), con cuántos pidieron aviso y cuántos reservaron.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Lanzamiento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LanzamientoProducto' }
        '404': { $ref: '#/components/responses/Problema' }
    put:
      operationId: guardarLanzamientoProducto
      summary: 'Reemplaza la configuración (null saca cada cosa). Una fecha nueva tiene que ser futura; el precio de oferta, menor que el del producto. Pide Catálogo.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LanzamientoEditable' }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LanzamientoProducto' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/inventario/movimientos:
    get:
      operationId: movimientosHoy
      summary: Movimientos de stock de hoy (ventas, ajustes, conteos e ingresos), del más nuevo al más viejo.
      responses:
        '200':
          description: Movimientos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MovimientoStock' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/bandeja:
    get:
      operationId: bandeja
      summary: Conversaciones de WhatsApp, Instagram, Telegram y Mercado Libre.
      responses:
        '200':
          description: Conversaciones
          content:
            application/json:
              schema:
                type: object
                required: [conversaciones, atendidasHoy]
                properties:
                  conversaciones: { type: array, items: { $ref: '#/components/schemas/ConversacionBreve' } }
                  atendidasHoy: { type: integer, description: 'Conversaciones que atendió Hornero hoy' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/bandeja/{id}:
    get:
      operationId: conversacion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Conversación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversacion' }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    post:
      operationId: responder
      summary: Manda un mensaje, o toma / devuelve la conversación a Hornero.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texto: { type: string, minLength: 1, maxLength: 2000 }
                tomada: { type: boolean }
                leida: { type: boolean, description: 'Al abrirla: los mensajes quedan leídos' }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/tarjeta:
    get:
      operationId: tarjeta
      summary: La tarjeta A6 para los paquetes (con los valores de fábrica si no se guardó).
      responses:
        '200': { description: Tarjeta, content: { application/json: { schema: { $ref: '#/components/schemas/Tarjeta' } } } }
    put:
      operationId: guardarTarjeta
      summary: Guarda la tarjeta A6.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Tarjeta' } } } }
      responses:
        '204': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/carritos:
    get:
      operationId: carritos
      responses:
        '200':
          description: Carritos abandonados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Carritos' }
        '401': { $ref: '#/components/responses/Problema' }
    put:
      operationId: guardarAutomaticos
      summary: Los recordatorios automáticos (a la hora, a las 24 h con 5% off, email al tercer día).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AutomaticosCarritos' }
      responses:
        '204': { description: Guardado }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/carritos/{id}/recordar:
    post:
      operationId: recordarCarrito
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Enviado }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/devoluciones:
    get:
      operationId: devoluciones
      responses:
        '200':
          description: Devoluciones
          content:
            application/json:
              schema:
                type: object
                required: [devoluciones, tasa]
                properties:
                  devoluciones: { type: array, items: { $ref: '#/components/schemas/Devolucion' } }
                  tasa: { type: number, description: 'Porcentaje de pedidos con devolución' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/devoluciones/{id}:
    post:
      operationId: resolverDevolucion
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [aprobar, cambio, deshacer] }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/resenas:
    get:
      operationId: resenas
      responses:
        '200':
          description: Reseñas y preguntas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResenasYPreguntas' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/preguntas/{id}:
    post:
      operationId: responderPregunta
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuesta]
              properties:
                respuesta: { type: string, minLength: 2, maxLength: 2000 }
      responses:
        '204': { description: Publicada }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/resenas/{id}:
    post:
      operationId: accionResena
      summary: Ocultar o mostrar una reseña (no se borra), o responderla públicamente (vacía, la saca).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [ocultar, mostrar, responder] }
                respuesta: { type: string, maxLength: 1000 }
      responses:
        '204': { description: Hecho }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/links:
    post:
      operationId: crearLink
      summary: Un link de pago para mandar por WhatsApp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto, concepto]
              properties:
                monto: { type: integer, minimum: 1, maximum: 100000000 }
                concepto: { type: string, minLength: 2, maxLength: 140 }
                cuotas: { type: boolean, default: true }
                pedido: { type: [integer, 'null'], description: 'Si es el cobro de un pedido, se marca pagado al pagar' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                type: object
                required: [codigo]
                properties:
                  codigo: { type: string }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/publico/links/{codigo}:
    get:
      operationId: verLink
      summary: La página de pago (pública).
      security: []
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkPublico' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/links/{codigo}/pagar:
    post:
      operationId: pagarLink
      summary: Pagar (con Mercado Pago; en la demo se simula).
      security: []
      parameters:
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: El checkout de Mercado Pago (init_point) para mandar a quien paga
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlExterna' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadopago:
    get:
      operationId: conexionMercadoPago
      summary: Si la tienda conectó su cuenta de Mercado Pago (marketplace por OAuth).
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConexionMP' }
    delete:
      operationId: desconectarMercadoPago
      summary: Borra los tokens de la tienda.
      responses:
        '204': { description: Desconectada }
  /v1/panel/integraciones/correo:
    get:
      operationId: conexionCorreo
      summary: Si la tienda conectó su cuenta de MiCorreo (Correo Argentino), con el origen y el paquete típico.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConexionCorreo' }
    post:
      operationId: conectarCorreo
      summary: Valida la cuenta de MiCorreo (/users/validate) y guarda el customerId; la contraseña no se guarda. Credenciales de API propias, cifradas (dueña o admin).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AltaCorreo' }
      responses:
        '200':
          description: Conectada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConexionCorreo' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
    put:
      operationId: ajustarCorreo
      summary: Cambia el origen y el paquete típico sin volver a pedir la contraseña (dueña o admin).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origen, paquete]
              properties:
                origen: { $ref: '#/components/schemas/OrigenCorreo' }
                paquete: { $ref: '#/components/schemas/PaqueteCorreo' }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConexionCorreo' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: desconectarCorreo
      summary: Borra la conexión (y las credenciales de API propias). Los envíos ya importados quedan.
      responses:
        '204': { description: Desconectada }
  /v1/panel/pedidos/{numero}/correo:
    parameters:
      - { name: numero, in: path, required: true, schema: { type: integer } }
    get:
      operationId: envioCorreo
      summary: El envío por Correo Argentino de un pedido (409 no_es_correo si va por otro lado).
      responses:
        '200':
          description: Envío
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioCorreo' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
    post:
      operationId: generarEnvioCorreo
      summary: Da de alta el envío en MiCorreo (/shipping/import). Un segundo pedido no lo duplica. 409 correo_rechazo con el mensaje de Correo.
      responses:
        '200':
          description: Generado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioCorreo' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/correo/seguimiento:
    put:
      operationId: seguimientoCorreo
      summary: Guarda el número de seguimiento que dio MiCorreo al pagar el rótulo (también en el pedido).
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [seguimiento], properties: { seguimiento: { type: string } } }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioCorreo' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/correo/cotizacion:
    get:
      operationId: cotizarCorreo
      summary: Cotización real de Correo Argentino para el checkout (409 sin_correo si la tienda no lo conectó, 502 si Correo no cotizó). Tope por IP.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: cp, in: query, required: true, schema: { type: string } }
        - { name: unidades, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CotizacionCorreo' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/correo/sucursales:
    get:
      operationId: sucursalesCorreo
      summary: Sucursales de Correo de una provincia donde se puede retirar, las más cercanas al CP primero.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: provincia, in: query, required: true, schema: { type: string } }
        - { name: cp, in: query, schema: { type: string } }
      responses:
        '200':
          description: Sucursales
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/SucursalCorreo' } }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/medicion:
    get:
      operationId: medicion
      summary: GA4, el píxel de Meta y los feeds de productos que la tienda ya cargó (con sus propias cuentas).
      responses:
        '200':
          description: Medición
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Medicion' }
    put:
      operationId: guardarMedicion
      summary: Reemplaza los IDs (vacío o null los borra) y qué feeds se cargaron.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Medicion' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/medicion/conversiones:
    get:
      operationId: conversiones
      summary: Cómo está la API de conversiones de Meta de la tienda (nunca devuelve el token).
      responses:
        '200':
          description: Conversiones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversiones' }
    put:
      operationId: guardarConversiones
      summary: Comprueba el token con Meta (que lea el píxel) y lo guarda cifrado. Token vacío con la conexión hecha cambia sólo el código de prueba.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, maxLength: 500 }
                codigoPrueba: { type: string, maxLength: 24, description: 'Código de eventos de prueba (TEST…); vacío lo saca' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: borrarConversiones
      summary: Desconecta la API de conversiones (borra el token).
      responses:
        '204': { description: Desconectada }
  /v1/publico/tiendas/{slug}:
    get:
      operationId: tiendaPublica
      summary: La tienda online como la ve quien compra (lib/tienda/tipos.ts TiendaPublica).
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Tienda, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/pedidos:
    post:
      operationId: comprarEnTienda
      summary: Arma el pedido de la tienda online. Precios y envío los calcula la API; con Mercado Pago devuelve el checkout.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrito, email, nombre, telefono, envio, pago]
              properties:
                carrito: { type: array, maxItems: 50, items: { type: object, required: [id, cantidad], properties: { id: { type: string }, varianteId: { type: [string, 'null'] }, cantidad: { type: integer, minimum: 1, maximum: 99 } } } }
                email: { type: string }
                nombre: { type: string }
                telefono: { type: string }
                dni: { type: string }
                cp: { type: string }
                direccion: { type: string }
                envio: { type: string, enum: [moto, retiro, correo-domicilio, correo-sucursal], description: 'Correo Argentino: a domicilio o a sucursal (el pedido queda con envio correo y la modalidad en la entrega)' }
                pago: { type: string, enum: [transferencia, mercadopago] }
                provincia: { type: string, description: 'Correo Argentino: código de provincia de MiCorreo (una letra)' }
                localidad: { type: string, description: 'Correo Argentino a domicilio' }
                sucursal: { type: string, description: 'Correo Argentino a sucursal: el código de /correo/sucursales' }
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema: { type: object, required: [numero, codigo, total], properties: { numero: { type: integer }, codigo: { type: string }, total: { type: integer }, url: { type: string } } }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/senas:
    post:
      operationId: senarEnTienda
      summary: 'Reserva un lanzamiento o encarga un producto pagando una seña con Mercado Pago (§52). Precio y seña los calcula la API; el stock se descuenta y vuelve si la seña no se paga en 30 min. Tope de 10 por hora por IP.'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productoId, nombre, email]
              properties:
                productoId: { type: string }
                varianteId: { type: string }
                cantidad: { type: integer, minimum: 1, maximum: 10 }
                nombre: { type: string, minLength: 2, maxLength: 80 }
                email: { type: string, maxLength: 200 }
                telefono: { type: string, maxLength: 30 }
      responses:
        '201':
          description: Pedido con la seña por pagar
          content:
            application/json:
              schema: { type: object, required: [numero, codigo, total, sena, url], properties: { numero: { type: integer }, codigo: { type: string }, total: { type: integer }, sena: { type: integer }, url: { type: string } } }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/productos/{id}/aviso:
    post:
      operationId: avisoLanzamiento
      summary: '«Avisame cuando salga»: anota el email (repetido no suma) y el worker escribe a la hora del lanzamiento. Tope de 10 por hora por IP y de 20.000 por producto.'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, maxLength: 200 } } }
      responses:
        '204': { description: Anotado }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/resenas:
    post:
      operationId: dejarResena
      summary: Una reseña de la tienda (409 ya_reseno si ese pedido ya tiene). Con el código público de un pedido cobrado queda con compra (una por pedido y producto). Tope de 10 por hora por IP.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [autor, estrellas]
              properties:
                codigo: { type: string, description: 'El código público del pedido' }
                productoId: { type: string }
                autor: { type: string, minLength: 2, maxLength: 60 }
                estrellas: { type: integer, minimum: 1, maximum: 5 }
                texto: { type: string, maxLength: 1000 }
      responses:
        '201': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/preguntas:
    post:
      operationId: preguntarEnTienda
      summary: Una pregunta sobre un producto publicado; se ve en la ficha cuando la tienda la responde. Tope de 10 por hora por IP.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productoId, nombre, pregunta]
              properties:
                productoId: { type: string }
                nombre: { type: string, minLength: 2, maxLength: 60 }
                email: { type: string, maxLength: 120 }
                pregunta: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201': { description: Guardada }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/carritos:
    post:
      operationId: guardarCarritoTienda
      summary: Guarda el carrito de quien dejó su email en el checkout (uno abierto por email; se cierra solo si compra). Tope de 60 por hora por IP.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, carrito]
              properties:
                email: { type: string, maxLength: 120 }
                nombre: { type: string, maxLength: 80 }
                carrito: { type: array, minItems: 1, maxItems: 50, items: { type: object, required: [id, cantidad], properties: { id: { type: string }, varianteId: { type: [string, 'null'] }, cantidad: { type: integer, minimum: 1, maximum: 99 } } } }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '429': { description: Demasiados carritos desde esa IP }
  /v1/publico/tiendas/{slug}/carritos/{token}:
    get:
      operationId: carritoPorToken
      summary: Las líneas del carrito del link del recordatorio, para volver a armarlo. 404 si ya compró o no existe.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Carrito
          content:
            application/json:
              schema: { type: object, required: [carrito], properties: { carrito: { type: array, items: { type: object, required: [id, cantidad], properties: { id: { type: string }, varianteId: { type: [string, 'null'] }, cantidad: { type: integer } } } } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/newsletter:
    post:
      operationId: suscribirNewsletter
      summary: Suma el email al newsletter de la tienda como pendiente y le manda el mail para confirmar (doble opt-in). Si ya confirmó, no manda nada. Topes por IP y tienda (10 por hora), por tienda (300 por hora) y por email (3 por día).
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, maxLength: 120 } } }
      responses:
        '202': { description: Pendiente de confirmar }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/newsletter/confirmar:
    post:
      operationId: confirmarNewsletter
      summary: El link del mail de confirmación.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: Suscripto }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/newsletter/baja:
    post:
      operationId: bajaNewsletter
      summary: La baja de un clic (link de cada mail y List-Unsubscribe-Post). Borra la suscripción.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '204': { description: De baja }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/pedidos/{codigo}:
    get:
      operationId: confirmacionPedido
      summary: La confirmación del pedido por su código público.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Pedido y su seguimiento, content: { application/json: { schema: { type: object, required: [numero, total, pago, nombre, estadoPago, estado, envio, seguimiento, alias, cbu, titular], properties: { numero: { type: integer }, total: { type: integer }, pago: { type: string }, nombre: { type: string }, estadoPago: { type: string }, estado: { $ref: '#/components/schemas/EstadoPedido' }, envio: { type: string, enum: [retiro, andreani, oca, correo, moto, mercadoenvios] }, seguimiento: { type: [string, 'null'] }, alias: { type: [string, 'null'] }, cbu: { type: [string, 'null'] }, titular: { type: [string, 'null'] }, sena: { $ref: '#/components/schemas/SenaPedido' } } } } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadolibre:
    get:
      operationId: conexionMercadoLibre
      summary: Si la tienda conectó su cuenta de Mercado Libre, y cuánto publicó.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConexionML' }
    put:
      operationId: ajustarMercadoLibre
      summary: Recargo sobre el precio (comisión) y pausar sin stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recargo, pausarSinStock]
              properties:
                recargo: { type: integer, minimum: 0, maximum: 60 }
                pausarSinStock: { type: boolean }
      responses:
        '204': { description: Guardado }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: desconectarMercadoLibre
      responses:
        '204': { description: Desconectada }
  /v1/panel/integraciones/mercadolibre/conectar:
    post:
      operationId: conectarMercadoLibre
      summary: La URL de autorización (PKCE, state de un solo uso).
      responses:
        '200':
          description: Adónde mandar a la persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlExterna' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadolibre/vuelta:
    post:
      operationId: volverMercadoLibre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, estado]
              properties:
                codigo: { type: string, maxLength: 512 }
                estado: { type: string, maxLength: 512 }
      responses:
        '204': { description: Conectada }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/productos/{id}/mercadolibre:
    post:
      operationId: publicarEnMercadoLibre
      summary: Publica el producto (categoría sugerida, precio con recargo, stock, foto y descripción).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicacionML' }
        '409': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: despublicarDeMercadoLibre
      summary: Pausa la publicación y deja de sincronizarla.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Pausada }
  /v1/webhooks/mercadolibre:
    post:
      operationId: webhookMercadoLibre
      summary: Avisos de Mercado Libre (orders_v2, questions, items). Se encolan y se traen con el token de la tienda.
      security: []
      responses:
        '200': { description: Recibido }
  /v1/panel/arca:
    get:
      operationId: conexionArca
      summary: La conexión con ARCA (facturación electrónica). Nunca devuelve la clave.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArcaConfig' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/arca/pedido:
    post:
      operationId: pedidoCertificadoArca
      summary: >-
        Genera la clave (queda cifrada en Tu Local Web y no sale nunca) y devuelve el pedido de certificado
        (CSR en PEM) para subir a ARCA. Reemplaza la clave anterior: el certificado que había deja de
        servir. Sólo dueña o admin.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArcaAlta' }
      responses:
        '200':
          description: El pedido de certificado
          content:
            application/json:
              schema:
                type: object
                required: [pedido]
                properties:
                  pedido: { type: string, maxLength: 8192, description: 'PEM: -----BEGIN CERTIFICATE REQUEST-----' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/arca/certificado:
    put:
      operationId: certificadoArca
      summary: El certificado que devolvió ARCA (PEM). Tiene que ser de la clave de esta tienda y de su CUIT. Sólo dueña o admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificado]
              properties:
                certificado: { type: string, minLength: 1, maxLength: 16384 }
      responses:
        '200':
          description: Guardado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArcaCertificado' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/arca/ajustes:
    put:
      operationId: ajustesArca
      summary: Punto de venta y facturar al cobrar, sin tocar el certificado. Sólo dueña o admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                puntoVenta: { type: integer, minimum: 1, maximum: 99998 }
                facturarAlCobrar: { type: boolean }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/arca/probar:
    post:
      operationId: probarArca
      summary: Pide (o reusa) el ticket del WSAA y el último comprobante autorizado del punto de venta.
      responses:
        '200':
          description: Conectada
          content:
            application/json:
              schema:
                type: object
                required: [ok, ultimo, detalle]
                properties:
                  ok: { type: boolean }
                  ultimo: { type: integer, minimum: 0 }
                  detalle: { type: string }
        '409': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadopago/conectar:
    post:
      operationId: conectarMercadoPago
      summary: La URL de autorización (state de un solo uso y PKCE). Sólo dueña o admin.
      responses:
        '200':
          description: Adónde mandar a la persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlExterna' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadopago/vuelta:
    post:
      operationId: volverMercadoPago
      summary: Canjea el código de la vuelta del OAuth y guarda los tokens cifrados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, estado]
              properties:
                codigo: { type: string, maxLength: 512 }
                estado: { type: string, maxLength: 512 }
      responses:
        '204': { description: Conectada }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/integraciones/mercadopago/caja:
    post:
      operationId: crearCajaMercadoPago
      summary: Da de alta la sucursal y la caja para cobrar con QR (con la dirección real del local).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UbicacionMP' }
      responses:
        '204': { description: Creada }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/pedidos/{numero}/qr:
    post:
      operationId: cobrarConQR
      summary: Orden dinámica de QR por el total del pedido (Orders API).
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
      responses:
        '201':
          description: El QR para mostrar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CobroQR' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/cobros/qr/{referencia}:
    get:
      operationId: estadoCobroQR
      summary: Consulta la orden en Mercado Pago y la aplica (created, processed, canceled…).
      parameters:
        - { name: referencia, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { type: object, required: [estado], properties: { estado: { type: string } } }
    delete:
      operationId: cancelarCobroQR
      parameters:
        - { name: referencia, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Cancelada }
  /v1/panel/pedidos/{numero}/reembolso:
    post:
      operationId: reembolsarPedido
      summary: Devuelve el pago del pedido por Mercado Pago (total, o parcial con monto). Pide Idempotency-Key.
      parameters:
        - { name: numero, in: path, required: true, schema: { type: integer } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 255 } }
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { monto: { type: integer, minimum: 1 } } }
      responses:
        '204': { description: Devuelto }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/cuenta/suscripcion:
    post:
      operationId: suscribirPlan
      summary: El abono de Tu Local Web. Crea la suscripción pendiente y devuelve dónde cargar la tarjeta; el plan cambia cuando Mercado Pago avisa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, ciclo]
              properties:
                plan: { type: string, enum: [emprende, pro, negocio] }
                ciclo: { type: string, enum: [mes, anio] }
                diasPrueba: { type: integer, minimum: 0, maximum: 14 }
      responses:
        '200':
          description: El checkout de la suscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlExterna' }
  /v1/panel/cuenta/abono:
    post:
      operationId: cambiarAbono
      summary: >-
        Pasa a un plan y ciclo con su cotización (§56): lo que se paga hoy, desde cuándo rige y cómo. url vacía si
        quedó hecho (o programado para el próximo cobro); si no, adónde ir en Mercado Pago (cargar la tarjeta del
        débito o pagar la diferencia prorrateada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, ciclo]
              properties:
                plan: { type: string, enum: [gratis, emprende, pro, negocio] }
                ciclo: { type: string, enum: [mes, anio] }
      responses:
        '200':
          description: Hecho (url vacía) o adónde ir
          content:
            application/json:
              schema: { type: object, required: [url], properties: { url: { type: string } } }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/cuenta/abono/vuelta:
    post:
      operationId: volverAbono
      summary: La vuelta de Mercado Pago (pago de la diferencia o débito autorizado), sin esperar el aviso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pago: { type: string, maxLength: 64 }
                suscripcion: { type: string, maxLength: 64 }
      responses:
        '204': { description: Conciliado }
  /v1/webhooks/mercadopago:
    post:
      operationId: webhookMercadoPago
      summary: Avisos de Mercado Pago, con x-signature (HMAC-SHA256). Sin firma válida, 401.
      security: []
      responses:
        '200': { description: Recibido }
        '401': { description: Firma inválida }
  /v1/panel/listas-precio:
    get:
      operationId: listasPrecio
      summary: Las listas de precio y la muestra para el aumento por inflación.
      responses:
        '200':
          description: Listas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListasPrecio' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/listas-precio/aumento:
    post:
      operationId: aumentarPrecios
      summary: Sube todos los precios (o lo programa para el lunes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pct, redondeo]
              properties:
                pct: { type: integer, minimum: 1, maximum: 50 }
                redondeo: { type: string, enum: ['no', '90', '500'] }
                programar: { type: boolean, default: false }
      responses:
        '200':
          description: Aplicado o programado
          content:
            application/json:
              schema:
                type: object
                required: [productos]
                properties:
                  productos: { type: integer }
                  para: { type: [string, 'null'], format: date-time }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/listas-precio/aumento/deshacer:
    post:
      operationId: deshacerAumento
      summary: Vuelve los precios a como estaban antes del último aumento.
      responses:
        '204': { description: Deshecho }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/listas-precio/programado:
    delete:
      operationId: cancelarAumento
      summary: Cancela el aumento programado.
      responses:
        '204': { description: Cancelado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/cupones:
    get:
      operationId: cupones
      summary: Cupones, automáticas y oferta relámpago.
      responses:
        '200':
          description: Cupones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupones' }
        '401': { $ref: '#/components/responses/Problema' }
    post:
      operationId: crearCupon
      summary: Un cupón nuevo (activo o programado).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuponNuevo' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/cupones/{id}:
    post:
      operationId: accionCupon
      summary: Pausar, activar, duplicar o ponerle un mínimo de compra.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [pausar, activar, duplicar, minimo, deshacer-minimo] }
                minimo: { type: integer, minimum: 0 }
      responses:
        '200':
          description: El cupón como quedó (o la copia)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cupon' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/cupones/consejo:
    delete:
      operationId: descartarConsejo
      summary: Oculta el consejo de Hornero (Ahora no).
      responses:
        '204': { description: Oculto }
  /v1/panel/automaticas/{id}:
    put:
      operationId: fijarAutomatica
      summary: Prende o apaga una promoción automática.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activa]
              properties:
                activa: { type: boolean }
      responses:
        '204': { description: Guardado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/relampago:
    post:
      operationId: accionRelampago
      summary: Sumar una hora, liberar 20 unidades, terminar o deshacer el final.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [sumar-hora, liberar, terminar, reanudar] }
      responses:
        '204': { description: Hecho }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/marketing:
    get:
      operationId: marketing
      summary: Audiencias, campañas y lo necesario para armar una nueva.
      responses:
        '200':
          description: Marketing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Marketing' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/newsletter:
    get:
      operationId: newsletter
      summary: El newsletter de la tienda (§50) — suscriptos (los más nuevos primero, hasta 5000), los números, lo enviado hoy contra el tope diario y los últimos envíos.
      responses:
        '200':
          description: Newsletter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Newsletter' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/newsletter/suscriptores/{id}:
    delete:
      operationId: borrarSuscriptor
      summary: Saca a alguien de la lista (confirmado o no).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Borrado }
        '401': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/newsletter/envios:
    post:
      operationId: mandarNovedad
      summary: Manda una novedad a los suscriptos confirmados de ahora. Sale por el worker de a tandas, con un tope de 500 mails por día por tienda (lo que no entra sigue al día siguiente).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovedadNueva' }
      responses:
        '201':
          description: En camino
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvioNewsletter' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '409': { description: 'sin_suscriptos: no hay confirmados', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/campanas:
    post:
      operationId: crearCampana
      summary: Manda (o programa) una campaña por WhatsApp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audiencia, mensaje, foto, boton, cupon]
              properties:
                audiencia: { type: string, enum: [todos, vip, riesgo, categoria] }
                mensaje: { type: string, minLength: 10, maxLength: 1000 }
                foto: { type: boolean }
                boton: { type: boolean }
                cupon: { type: boolean }
                programar: { type: boolean, default: false }
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campana' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/canales:
    get:
      operationId: canales
      summary: Lo vendido por canal este mes, ya descontadas las comisiones.
      responses:
        '200':
          description: Canales
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Canales' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/canales/{id}:
    put:
      operationId: fijarCanal
      summary: Pausa o activa un canal conectado.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '204': { description: Guardado }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/informes:
    get:
      operationId: informes
      summary: Los últimos 12 meses.
      responses:
        '200':
          description: Informes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Informes' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/actividad:
    get:
      operationId: actividad
      summary: >-
        Quién hizo qué en la tienda (docs/decisiones.md §39): lo que anota cada sección, del más nuevo al más viejo,
        de a 50. Sólo la dueña y administración (403 a ventas y local). Se guarda un año.
      parameters:
        - { name: persona, in: query, schema: { type: string }, description: 'Id de la persona (de `personas`) o «soporte»' }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/CategoriaEvento' } }
        - { name: desde, in: query, schema: { type: string, format: date }, description: 'YYYY-MM-DD, hora de Argentina, inclusive' }
        - { name: hasta, in: query, schema: { type: string, format: date }, description: 'YYYY-MM-DD, hora de Argentina, inclusive' }
        - { name: cursor, in: query, schema: { type: string }, description: 'El `siguiente` de la página anterior' }
      responses:
        '200':
          description: Actividad
          content:
            application/json:
              schema:
                type: object
                required: [items, siguiente, personas]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Evento' } }
                  siguiente: { type: [string, 'null'], description: 'Cursor de la página siguiente (null: no hay más)' }
                  personas:
                    type: array
                    description: Quiénes aparecen en la actividad, para el filtro
                    items:
                      type: object
                      required: [id, nombre]
                      properties:
                        id: { type: string }
                        nombre: { type: string }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/actividad/exportar:
    get:
      operationId: exportarActividad
      summary: Las filas del CSV de la actividad con los mismos filtros (hasta 20.000). La descarga queda anotada.
      parameters:
        - { name: persona, in: query, schema: { type: string } }
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/CategoriaEvento' } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
      responses:
        '200':
          description: Filas (la primera es el encabezado)
          content:
            application/json:
              schema:
                type: object
                required: [filas]
                properties:
                  filas: { type: array, items: { type: array, items: { type: string } } }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/actividad/{id}/deshacer:
    post:
      operationId: deshacerEvento
      summary: Vuelve atrás un cambio.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deshecho }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/para-hacer:
    get:
      operationId: paraHacer
      summary: Las tareas de hoy, ordenadas por lo que más plata mueven.
      responses:
        '200':
          description: Tareas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParaHacer' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/para-hacer/{id}:
    put:
      operationId: marcarTarea
      summary: Marca o desmarca una tarea de hoy.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hecha]
              properties:
                hecha: { type: boolean }
      responses:
        '204': { description: Guardado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/finanzas:
    get:
      operationId: finanzas
      summary: Lo disponible, lo que se va a liquidar, los gastos, el flujo y los movimientos.
      responses:
        '200':
          description: Finanzas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Finanzas' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/finanzas/retiro:
    post:
      operationId: retirar
      summary: Transfiere lo disponible a la cuenta bancaria.
      responses:
        '200':
          description: En camino
          content:
            application/json:
              schema:
                type: object
                required: [monto, cuenta]
                properties:
                  monto: { type: integer }
                  cuenta: { type: string }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/mi-tienda:
    get:
      operationId: miTienda
      summary: El editor de la tienda (borrador y si hay cambios sin publicar).
      responses:
        '200':
          description: Mi tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MiTienda' }
        '401': { $ref: '#/components/responses/Problema' }
    put:
      operationId: guardarMiTienda
      summary: Guarda el borrador (secciones y colores).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisenoTienda' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/mi-tienda/publicar:
    post:
      operationId: publicarTienda
      summary: Publica el borrador.
      responses:
        '204': { description: Publicado }
  /v1/panel/configuracion:
    get:
      operationId: configuracion
      summary: Negocio, equipo, seguridad, sesiones, avisos y plan.
      responses:
        '200':
          description: Configuración
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Configuracion' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/configuracion/negocio:
    put:
      operationId: guardarNegocio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Negocio' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/configuracion/entregas:
    get:
      operationId: entregas
      summary: Envíos y retiro de la tienda (sin configurar, retiro con la dirección del negocio y sin moto), con el estado de Correo Argentino y del envío gratis.
      responses:
        '200':
          description: Entregas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoEntregas' }
    put:
      operationId: guardarEntregas
      summary: Guarda retiro y moto. Tiene que quedar al menos una forma de entrega (retiro, moto o Correo conectado).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Entregas' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/configuracion/mayorista:
    put:
      operationId: guardarMayorista
      summary: Guarda la venta mayorista (§49), prendida o apagada, con su mínimo del carrito.
      description: |
        Prendida o apagada es el mismo interruptor que la promoción automática «Precio mayorista» de
        Cupones. Hace falta al menos un mínimo (unidades o monto); con los dos, el carrito tiene que
        cumplir los dos. El monto se mide con los precios minoristas.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VentaMayorista' }
      responses:
        '204': { description: Guardado }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/configuracion/{grupo}/{clave}:
    put:
      operationId: fijarOpcion
      summary: Prende o apaga una opción de seguridad (de la persona) o un aviso (de la tienda).
      description: |
        Seguridad: `avisoIngreso` (mail «Entraron a tu cuenta» con cada sesión nueva) e `inactivas`
        (una sesión sin usar hace 7 días deja de valer; al prenderla se cierran las que ya cumplen).
      parameters:
        - { name: grupo, in: path, required: true, schema: { type: string, enum: [seguridad, avisos] } }
        - { name: clave, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activo]
              properties:
                activo: { type: boolean }
      responses:
        '204': { description: Guardado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/sesiones:
    delete:
      operationId: cerrarOtrasSesiones
      summary: Cierra todas las sesiones de la persona menos la actual.
      responses:
        '200':
          description: Cerradas
          content:
            application/json:
              schema:
                type: object
                required: [cerradas]
                properties:
                  cerradas: { type: integer }
  /v1/panel/sesiones/{id}:
    delete:
      operationId: cerrarSesion
      summary: Cierra otra sesión de la cuenta.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Cerrada }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/dispositivos:
    post:
      operationId: registrarDispositivo
      summary: >-
        Registra el iPhone de la sesión para los avisos push (APNs). Lo llama la app de iPhone con su
        token de sesión, directo contra api.tulocalweb.com.ar. El dispositivo queda atado a esta sesión y
        a la persona: si la sesión se cierra o vence, deja de recibir. Si el token estaba con otra sesión
        (otra cuenta en el mismo iPhone), pasa a esta. Cualquier rol; no con la sesión de una IA ni del
        soporte.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Dispositivo' }
      responses:
        '204': { description: Registrado }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: bajaDispositivo
      summary: Da de baja el iPhone de esta sesión (la app lo llama al cerrar sesión; cerrar la sesión también lo borra).
      responses:
        '204': { description: Dado de baja }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/push-web:
    get:
      operationId: estadoPushWeb
      summary: >-
        Push web del panel instalado como app: la clave pública VAPID para suscribirse (vacía si el
        push web está apagado) y si esta sesión ya tiene una suscripción. Cualquier rol; no con la
        sesión de una IA ni del soporte.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoPushWeb' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
    post:
      operationId: suscribirPushWeb
      summary: >-
        Guarda la suscripción de Web Push del navegador, atada a esta sesión y a la persona (si la
        sesión se cierra o vence, deja de recibir). Sólo servicios de push conocidos (FCM, Apple,
        Mozilla, Windows). Si el endpoint estaba con otra sesión, pasa a esta. 409 push_apagado si no
        hay claves VAPID.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuscripcionWeb' }
      responses:
        '204': { description: Suscripta }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: bajaPushWeb
      summary: Borra las suscripciones de esta sesión (desactivar los avisos en este celular).
      responses:
        '204': { description: Dada de baja }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/push-web/prueba:
    post:
      operationId: probarPushWeb
      summary: >-
        Encola un aviso de prueba a las suscripciones de esta sesión (lo manda el worker en un
        segundo). 409 sin_suscripcion si esta sesión no activó los avisos, o push_apagado.
      responses:
        '202': { description: Encolado }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/equipo:
    post:
      operationId: invitar
      summary: Invita a alguien al equipo por email (link de un solo uso que vence en 7 días). Sólo la dueña.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contacto, rol]
              properties:
                contacto: { type: string, minLength: 6, maxLength: 120, description: Email }
                rol: { type: string, enum: [admin, ventas, local] }
      responses:
        '201':
          description: Invitado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Miembro' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/plan:
    put:
      operationId: cambiarPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [gratis, emprende, pro, negocio] }
                ciclo: { type: string, enum: [mes, anio] }
      responses:
        '204': { description: Cambiado }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/cuenta/plan:
    get:
      operationId: planCuenta
      summary: Plan, uso del mes, medio de pago y facturas de Tu Local Web.
      responses:
        '200':
          description: Plan
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCuenta' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/cuenta/pack:
    post:
      operationId: comprarPack
      summary: Suma 2.000 respuestas de Hornero este mes ($ 4.900).
      responses:
        '204': { description: Sumado }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: devolverPack
      summary: Deshace el último pack de este mes.
      responses:
        '204': { description: Devuelto }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/cuenta/cancelacion:
    post:
      operationId: cancelarPlan
      summary: Cancela el plan al final del período (o acepta la oferta).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo, accion]
              properties:
                motivo: { type: integer, minimum: 0, maximum: 4 }
                accion: { type: string, enum: [cancelar, oferta] }
      responses:
        '200':
          description: Hecho
          content:
            application/json:
              schema:
                type: object
                description: 'Al cancelar, hasta cuándo sigue lo pagado; al aceptar el descuento para quedarse (§57), el beneficio.'
                properties:
                  hasta: { type: [string, 'null'], format: date-time }
                  beneficio:
                    type: object
                    required: [pct, cobros]
                    properties:
                      pct: { type: integer }
                      cobros: { type: integer }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: reactivarPlan
      summary: Deshace la cancelación.
      responses:
        '204': { description: Reactivado }
  /v1/panel/equipo/{id}:
    put:
      operationId: cambiarRol
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rol]
              properties:
                rol: { type: string, enum: [admin, ventas, local] }
      responses:
        '204': { description: Cambiado }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: quitarDelEquipo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Quitado }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/equipo/{id}/reenviar:
    post:
      operationId: reenviarInvitacion
      summary: Manda otra vez la invitación con un link nuevo (el anterior deja de valer) y otros 7 días.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Reenviada }
        '404': { $ref: '#/components/responses/Problema' }
        '422': { $ref: '#/components/responses/Problema' }
  /v1/panel/dominios:
    get:
      operationId: dominios
      summary: Dónde se ve la tienda y los dominios propios.
      responses:
        '200':
          description: Dominios
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dominios' }
    post:
      operationId: conectarDominio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dominio]
              properties:
                dominio: { type: string, maxLength: 253 }
      responses:
        '201': { description: Agregado }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/panel/dominios/{dominio}:
    put:
      operationId: dominioPrincipal
      summary: Lo hace principal.
      parameters:
        - { name: dominio, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Hecho }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: quitarDominio
      parameters:
        - { name: dominio, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Quitado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/notificaciones:
    get:
      operationId: notificaciones
      summary: >-
        La campanita (docs/decisiones.md §45): las notificaciones de la persona de la sesión en esa tienda, de la más
        nueva a la más vieja, con cuántas no leyó. Cualquiera del equipo; cada persona ve sólo las suyas. Se guardan
        90 días. Una IA conectada o el soporte mirando reciben la lista vacía.
      parameters:
        - { name: cursor, in: query, schema: { type: string }, description: 'El `siguiente` de la página anterior' }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaNotificaciones' }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/notificaciones/sin-leer:
    get:
      operationId: notificacionesSinLeer
      summary: Cuántas notificaciones no leyó la persona (la insignia de la campanita).
      responses:
        '200':
          description: Sin leer
          content:
            application/json:
              schema:
                type: object
                required: [sinLeer]
                properties:
                  sinLeer: { type: integer }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/notificaciones/{id}/leida:
    post:
      operationId: marcarNotificacionLeida
      summary: Marca leída una notificación de la persona (al tocarla). 404 si no es suya o ya se borró.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Marcada }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/notificaciones/leidas:
    post:
      operationId: marcarNotificacionesLeidas
      summary: «Marcar todo como leído» (las de la persona en la tienda de la sesión).
      responses:
        '204': { description: Marcadas }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/notificaciones/preferencias:
    get:
      operationId: preferenciasAvisos
      responses:
        '200':
          description: Preferencias
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreferenciasAvisos' }
    put:
      operationId: guardarPreferenciasAvisos
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreferenciasAvisos' }
      responses:
        '204': { description: Guardado }
  /v1/panel/datos:
    get:
      operationId: misDatos
      summary: Cuánto hay de cada cosa para exportar y lo exportado.
      responses:
        '200':
          description: Datos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MisDatos' }
  /v1/panel/datos/{tipo}:
    get:
      operationId: exportar
      summary: Exporta productos, clientes, pedidos, facturas, reseñas o conversaciones.
      parameters:
        - { name: tipo, in: path, required: true, schema: { type: string, enum: [productos, clientes, pedidos, facturas, resenas, conversaciones] } }
      responses:
        '200':
          description: Las filas (el BFF arma el CSV, el Excel o el ZIP)
          content:
            application/json:
              schema:
                type: object
                required: [filas]
                properties:
                  filas:
                    type: array
                    items: { type: array, items: { type: [string, number, 'null'] } }
  /v1/panel/datos/exportaciones:
    post:
      operationId: registrarExportacion
      summary: Anota una descarga en "Exportaciones recientes" (guarda las últimas 5).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, formato]
              properties:
                tipo: { type: string, enum: [productos, clientes, pedidos, facturas, resenas, conversaciones, todo] }
                formato: { type: string, enum: [csv, excel] }
      responses:
        '204': { description: Anotada }
  /v1/panel/datos/inactivos:
    delete:
      operationId: borrarInactivos
      summary: Programa el borrado de los clientes sin compras en 3 años (7 días para frenarlo).
      responses:
        '200':
          description: Programado
          content:
            application/json:
              schema:
                type: object
                required: [clientes]
                properties:
                  clientes: { type: integer }
    post:
      operationId: frenarBorrado
      responses:
        '204': { description: Frenado }
  /v1/panel/cuenta:
    delete:
      operationId: cerrarCuenta
      summary: Cierra la tienda. 90 días para arrepentirse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmacion]
              properties:
                confirmacion: { type: string }
      responses:
        '204': { description: Cerrada }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/tienda:
    get:
      operationId: obtenerTienda
      summary: La tienda de la sesión
      responses:
        '200':
          description: Tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tienda' }
        '401':
          description: Sin sesión
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /v1/panel/tienda/direccion:
    get:
      operationId: disponibilidadDireccion
      summary: 'Si la tienda puede pasar a usar la dirección tulocalweb.com.ar/t/{slug} (formato, reservados, ya usada por otra tienda).'
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisponibilidadDireccion' }
        '401': { $ref: '#/components/responses/Problema' }
    put:
      operationId: cambiarDireccion
      summary: 'Cambia la dirección de la tienda. La anterior redirige para siempre (301) y ninguna otra tienda puede tomarla. Hasta 5 cambios por día.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,58}[a-z0-9]$' }
      responses:
        '200':
          description: Cambiada (o ya era esa)
          content:
            application/json:
              schema:
                type: object
                required: [slug, anterior]
                properties:
                  slug: { type: string }
                  anterior: { type: string }
        '400': { $ref: '#/components/responses/Problema' }
        '409':
          description: 'code: usado, reservado o tope'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problema' }
  /v1/panel/turnos/ajustes:
    get:
      operationId: ajustesTurnos
      summary: Turnos con seña — si están activos, la seña, la anticipación, los días de vista y el horario.
      responses:
        '200':
          description: Ajustes (los de por defecto si nunca se guardaron)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AjustesTurnos' }
    put:
      operationId: guardarAjustesTurnos
      summary: Guarda los ajustes de turnos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AjustesTurnos' }
      responses:
        '200':
          description: Como quedaron
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AjustesTurnos' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/servicios:
    get:
      operationId: serviciosTurnos
      summary: Los servicios que se reservan (activos e inactivos), por orden.
      responses:
        '200':
          description: Servicios
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
    post:
      operationId: crearServicio
      summary: Un servicio nuevo (va al final del orden si no trae uno).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioEditable' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/servicios/{id}:
    put:
      operationId: guardarServicio
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioEditable' }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: borrarServicio
      summary: Lo saca (los turnos ya tomados quedan con el nombre copiado).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/profesionales:
    get:
      operationId: profesionalesTurnos
      summary: Quienes atienden (activos e inactivos), por orden.
      responses:
        '200':
          description: Profesionales
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Profesional' } }
    post:
      operationId: crearProfesional
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfesionalEditable' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profesional' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/profesionales/{id}:
    put:
      operationId: guardarProfesional
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfesionalEditable' }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profesional' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: borrarProfesional
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos:
    get:
      operationId: agendaTurnos
      summary: La agenda entre dos días (inclusive), opcionalmente de un profesional; por inicio.
      parameters:
        - { name: desde, in: query, required: true, schema: { type: string, format: date } }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date } }
        - { name: profesional, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Turnos
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Turno' } }
        '400': { $ref: '#/components/responses/Problema' }
    post:
      operationId: crearTurno
      summary: Un turno cargado a mano (origen panel, sin seña). Si se superpone, 409 salvo que venga forzar.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TurnoNuevo' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
        '400': { $ref: '#/components/responses/Problema' }
        '409': { description: 'ocupado: se superpone con otro turno (mandar forzar para tomarlo igual)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/turnos/{id}:
    patch:
      operationId: estadoTurno
      summary: Cualquiera de los cinco estados (también sirve para deshacer).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { $ref: '#/components/schemas/EstadoTurno' }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/panel/turnos/{id}/devolver-sena:
    post:
      operationId: devolverSena
      summary: Devuelve la seña pagada con Mercado Pago (Reembolsar). Cancelar no la devuelve sola.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: El turno con la seña devuelta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Turno' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'sin_sena (no hay seña pagada) o sin_cobros (sin Mercado Pago)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/turnos:
    get:
      operationId: turnosPublicos
      summary: Servicios y profesionales activos y los ajustes públicos. 404 si la tienda no tiene turnos activos.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Turnos de la tienda
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnosPublicos' }
        '404': { $ref: '#/components/responses/Problema' }
    post:
      operationId: reservarTurno
      summary: Reserva desde la tienda. Precio, duración y seña salen del servicio; la disponibilidad se re-chequea en una transacción. Con seña y Mercado Pago devuelve el checkout (url).
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaTurno' }
      responses:
        '201':
          description: Reservado
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string }, url: { type: string } } }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'ocupado: el horario ya no está libre', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/turnos/libres:
    get:
      operationId: turnosLibres
      summary: Los horarios libres de un día (regla 1). Sin profesional (o "cualquiera") sirve si alguno está libre.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: servicio, in: query, required: true, schema: { type: string } }
        - { name: profesional, in: query, required: false, schema: { type: string } }
        - { name: dia, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Horarios libres, por hora
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HorarioLibre' } }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/turnos/{codigo}:
    get:
      operationId: turnoPublico
      summary: El turno por su código público (la confirmación).
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Turno
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnoPublico' }
        '404': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: cancelarTurnoPublico
      summary: Cancela el turno (hasta anticipacionMin antes; cancelar uno cancelado no es error). Con seña pagada, la devolución la hace la tienda.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TurnoPublico' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'tarde: falta menos que la anticipación mínima', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/suscripciones:
    get:
      operationId: suscripcionesPanel
      summary: 'Suscripciones (§51) — los planes de la tienda (activos y pausados), los suscriptores y si tiene Mercado Pago conectado (sin eso no puede ofrecer planes).'
      responses:
        '200':
          description: Planes y suscriptores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PanelSuscripciones' }
  /v1/panel/suscripciones/planes:
    post:
      operationId: crearPlanSuscripcion
      summary: Un plan nuevo (va al final del orden). Tiene que incluir productos del catálogo, texto o los dos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanSuscripcionEditable' }
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSuscripcion' }
        '400': { $ref: '#/components/responses/Problema' }
  /v1/panel/suscripciones/planes/{id}:
    put:
      operationId: guardarPlanSuscripcion
      summary: Edita el plan. Lo que pagan quienes ya se suscribieron no cambia (la suscripción copió el precio).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanSuscripcionEditable' }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanSuscripcion' }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    delete:
      operationId: borrarPlanSuscripcion
      summary: Lo borra si nunca tuvo suscriptores; si tuvo, 409 en_uso (se pausa).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Borrado }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'en_uso: tiene suscriptores', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/suscripciones/{id}/cancelar:
    post:
      operationId: cancelarSuscriptor
      summary: La tienda da de baja una suscripción (primero en Mercado Pago). Cancelar una cancelada no es error.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Suscriptor' }
        '404': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/suscripciones:
    post:
      operationId: suscribirse
      summary: 'El alta desde la tienda: el precio sale del plan. Devuelve el link privado (codigo) y adónde autorizar el débito en Mercado Pago (url). Tope de 10 por IP y 5 por email por hora.'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AltaSuscripcion' }
      responses:
        '201':
          description: Pendiente de autorizar en Mercado Pago
          content:
            application/json:
              schema: { type: object, required: [codigo], properties: { codigo: { type: string }, url: { type: string } } }
        '400': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'cupo (el plan se llenó) o sin_cobros (la tienda no tiene Mercado Pago)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '429': { $ref: '#/components/responses/Problema' }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/suscripciones/{codigo}:
    get:
      operationId: suscripcionPublica
      summary: La suscripción por su link privado (sin cuenta).
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Suscripción
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuscripcionPublica' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/suscripciones/{codigo}/{accion}:
    post:
      operationId: cambiarSuscripcionPublica
      summary: Pausar (activa), reanudar (pausada) o cancelar, desde el link privado. Primero en Mercado Pago.
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: codigo, in: path, required: true, schema: { type: string } }
        - { name: accion, in: path, required: true, schema: { type: string, enum: [pausar, reanudar, cancelar] } }
      responses:
        '200':
          description: Como quedó
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuscripcionPublica' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'estado: no se puede en el estado actual', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { $ref: '#/components/responses/Problema' }
  /v1/panel/telegram:
    get:
      operationId: estadoTelegram
      summary: Hornero en Telegram — si hay un chat vinculado a la tienda y con qué nombre.
      responses:
        '200':
          description: Estado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoTelegram' }
    delete:
      operationId: desvincularTelegram
      summary: Desvincula el chat (dueña o admin). Devuelve el chat que estaba para que el BFF le avise; el navegador no lo ve.
      responses:
        '200':
          description: Desvinculado
          content:
            application/json:
              schema: { type: object, required: [chat], properties: { chat: { type: integer, format: int64 } } }
        '204': { description: No había chat vinculado }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/telegram/codigo:
    post:
      operationId: codigoTelegram
      summary: Código de un solo uso (10 min) para vincular un chat con el bot (dueña o admin). El anterior deja de servir.
      responses:
        '201':
          description: Código
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CodigoTelegram' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/panel/importaciones:
    post:
      operationId: crearImportacion
      summary: 'Empieza a importar la tienda desde otra plataforma (dueña o admin). Una sola activa por tienda. Con la API avanza sola por el outbox; en la demo, de a un lote por pedido del navegador (avanzarImportacion).'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportacionNueva' }
      responses:
        '201':
          description: Creada (pendiente, con el primer paso encolado)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'importacion_activa, sin_fuente (todavía no se importa desde esa plataforma) o sin_cifrado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/importaciones/actual:
    get:
      operationId: importacionActual
      summary: La importación en curso o, si no hay, la última.
      responses:
        '200':
          description: Importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '204': { description: Nunca se importó nada }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/importaciones/tiendanube:
    get:
      operationId: tiendanubeDisponible
      summary: Si este servidor puede conectar una tienda de Tiendanube (tiene la app de socio y con qué cifrar el token).
      responses:
        '200':
          description: Disponibilidad
          content:
            application/json:
              schema:
                type: object
                required: [disponible]
                properties:
                  disponible: { type: boolean }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/panel/importaciones/tiendanube/conectar:
    post:
      operationId: conectarTiendanube
      summary: La URL de autorización de la app de Tiendanube (dueña o admin), con un state de un solo uso de 10 minutos.
      responses:
        '200':
          description: Adónde mandar a la persona
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UrlExterna' }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'sin_tiendanube: el servidor no tiene la app configurada', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/importaciones/tiendanube/vuelta:
    post:
      operationId: volverTiendanube
      summary: 'La vuelta del OAuth: consume el state, canjea el código por el token (que se guarda cifrado y nunca vuelve) y crea la importación.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, estado]
              properties:
                codigo: { type: string, maxLength: 512 }
                estado: { type: string, maxLength: 512 }
      responses:
        '201':
          description: Importación creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '400': { description: 'El state no existe, venció o ya se usó', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'sin_tiendanube, importacion_activa o sin_cifrado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '502': { description: 'tiendanube: no aceptó el código', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/importaciones/{id}/cancelar:
    post:
      operationId: cancelarImportacion
      summary: Frena una importación en curso (dueña o admin). Lo ya guardado queda; la credencial se borra.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Importacion' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { description: 'terminada: ya había terminado', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
  /v1/panel/clientes/{id}/historial:
    get:
      operationId: historialCliente
      summary: 'Los pedidos importados de otra plataforma de un cliente (el id de la lista de Clientes), del más nuevo al más viejo, hasta 200. No son pedidos de Tu Local Web.'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Historial
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PedidoHistorial' } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/publico/tiendas/{slug}/redireccion:
    get:
      operationId: redireccionTienda
      summary: 'Un link de la tienda vieja: 301 con Location = el path en Tu Local Web, relativo a la tienda. Lo pide el BFF cuando un path de /t/{slug} no existe.'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string, maxLength: 2000 }, description: 'El path pedido (se normaliza: sin query, en minúsculas, sin barra final)' }
      responses:
        '301':
          description: Redirección
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { type: object, required: [hacia], properties: { hacia: { type: string } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/publico/slugs/{slug}:
    get:
      operationId: slugVigente
      summary: 'Una dirección vieja de una tienda que la cambió: devuelve la vigente (la web responde 301 de /t/{viejo}/… a /t/{nuevo}/…).'
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: La dirección vigente
          content:
            application/json:
              schema: { type: object, required: [slug], properties: { slug: { type: string } } }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/telegram/vincular:
    post:
      operationId: vincularTelegram
      summary: 'El /start del bot: canjea el código y vincula el chat. Sólo el BFF (X-Mostrador-BFF).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, chat, nombre]
              properties:
                codigo: { type: string }
                chat: { type: integer, format: int64 }
                nombre: { type: string, description: 'Nombre de quien escribe en Telegram' }
      responses:
        '200':
          description: Vinculado
          content:
            application/json:
              schema: { type: object, required: [tienda], properties: { tienda: { type: string } } }
        '403': { $ref: '#/components/responses/Problema' }
        '409': { description: 'codigo_invalido (vencido, usado o inexistente) o chat_ocupado (el chat está en otra tienda)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problema' } } } }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/telegram/desvincular:
    post:
      operationId: desvincularChatTelegram
      summary: 'El /desvincular del bot. Sólo el BFF.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [chat], properties: { chat: { type: integer, format: int64 } } }
      responses:
        '204': { description: Desvinculado }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/telegram/contexto:
    post:
      operationId: contextoTelegram
      summary: 'Lo que necesita Hornero para responder en el chat (lo mismo que el panel) y cuántos mensajes lleva hoy la tienda (suma este). Sólo el BFF.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [chat], properties: { chat: { type: integer, format: int64 } } }
      responses:
        '200':
          description: Contexto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContextoTelegram' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/ingresar:
    post:
      operationId: equipoIngresar
      summary: Ingreso de una persona del equipo (cuenta aparte de las de las tiendas)
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email, clave], properties: { email: { type: string }, clave: { type: string } } }
      responses:
        '200': { description: Sesión del equipo, content: { application/json: { schema: { $ref: '#/components/schemas/SesionNueva' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '429': { $ref: '#/components/responses/Problema' }
  /v1/equipo/salir:
    post:
      operationId: equipoSalir
      responses:
        '204': { description: Sesión cerrada }
  /v1/equipo/sesion:
    get:
      operationId: equipoSesion
      responses:
        '200': { description: Quién está y qué puede hacer, content: { application/json: { schema: { $ref: '#/components/schemas/SesionEquipo' } } } }
        '401': { $ref: '#/components/responses/Problema' }
  /v1/equipo/inicio:
    get:
      operationId: equipoInicio
      responses:
        '200': { description: Números y alertas del día, content: { application/json: { schema: { $ref: '#/components/schemas/InicioEquipo' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas:
    get:
      operationId: equipoTiendas
      summary: 'Todas las tiendas, con el motor de listas (filas: FilaTiendaEquipo). Segmento: estado. Facetas: plan, rubro, plantilla, partner. Rango: días desde el alta (menor que).'
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: seg, in: query, schema: { type: string } }
        - { name: facetas, in: query, schema: { type: string } }
        - { name: rango, in: query, schema: { type: integer, minimum: 0 } }
        - { name: orden, in: query, schema: { type: string, enum: [recientes, nombre, mrr] } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: cuantos, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200': { description: Lista, content: { application/json: { schema: { $ref: '#/components/schemas/ListaGenerica' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}:
    get:
      operationId: equipoFichaTienda
      summary: Ficha de una tienda. Queda en la auditoría (ver_ficha).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Ficha, content: { application/json: { schema: { $ref: '#/components/schemas/FichaTiendaEquipo' } } } }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}/acciones:
    post:
      operationId: equipoAccionTienda
      summary: 'Una acción sobre la tienda, con su permiso por rol. Se aplica y se audita en la misma transacción (equipo.accion_tienda).'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccionTiendaEquipo' }
      responses:
        '204': { description: Hecho }
        '400': { $ref: '#/components/responses/Problema' }
        '401': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}/notas:
    post:
      operationId: equipoNota
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [texto], properties: { texto: { type: string, minLength: 1, maxLength: 1000 } } }
      responses:
        '201': { description: Nota, content: { application/json: { schema: { $ref: '#/components/schemas/NotaEquipo' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/tiendas/{id}/mirar:
    post:
      operationId: equipoMirarTienda
      summary: 'Token de sólo lectura (30 min) para ver el panel de la tienda como la ve la dueña. Queda en la auditoría (mirar_tienda).'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/SesionNueva' } } } }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/consultas:
    get:
      operationId: equipoConsultas
      summary: 'Bandeja: contacto y arrepentimientos (con código ARR y plazo legal), con la gente del equipo para asignar.'
      responses:
        '200': { description: Bandeja, content: { application/json: { schema: { $ref: '#/components/schemas/BandejaEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/consultas/{tipo}/{id}:
    get:
      operationId: equipoConsulta
      summary: Una consulta con sus respuestas. Queda en la auditoría (ver_consulta).
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoConsulta' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Consulta, content: { application/json: { schema: { $ref: '#/components/schemas/ConsultaDetalle' } } } }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
    post:
      operationId: equipoActualizarConsulta
      summary: Cambia el estado o la persona asignada.
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoConsulta' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                estado: { $ref: '#/components/schemas/EstadoConsulta' }
                asignadoA: { type: [string, 'null'], description: 'Id de la persona del equipo; null la desasigna' }
      responses:
        '204': { description: Hecho }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/consultas/{tipo}/{id}/responder:
    post:
      operationId: equipoResponder
      summary: 'Responde por mail (outbox → correo). Una consulta nueva pasa a en curso.'
      parameters:
        - { name: tipo, in: path, required: true, schema: { $ref: '#/components/schemas/TipoConsulta' } }
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asunto, texto]
              properties:
                asunto: { type: string, minLength: 3, maxLength: 140 }
                texto: { type: string, minLength: 3, maxLength: 4000 }
      responses:
        '201': { description: Respuesta encolada, content: { application/json: { schema: { $ref: '#/components/schemas/RespuestaEquipo' } } } }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
  /v1/equipo/partners:
    get:
      operationId: equipoPartners
      responses:
        '200': { description: Postulaciones y partners activos, content: { application/json: { schema: { $ref: '#/components/schemas/PartnersEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/partners/{id}:
    post:
      operationId: equipoDecidirPartner
      summary: 'Aprueba o rechaza una postulación (el rechazo pide motivo). Avisa por mail y, al aprobar, da de alta al partner (paquete partners).'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [aprobar, rechazar] }
                motivo: { type: string, maxLength: 500 }
      responses:
        '204': { description: Hecho }
        '400': { $ref: '#/components/responses/Problema' }
        '403': { $ref: '#/components/responses/Problema' }
        '404': { $ref: '#/components/responses/Problema' }
        '409': { $ref: '#/components/responses/Problema' }
  /v1/equipo/facturacion:
    get:
      operationId: equipoFacturacion
      responses:
        '200': { description: Abonos y comprobantes, content: { application/json: { schema: { $ref: '#/components/schemas/FacturacionEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
  /v1/equipo/auditoria:
    get:
      operationId: equipoAuditoria
      parameters:
        - { name: miembro, in: query, schema: { type: string } }
        - { name: accion, in: query, schema: { type: string } }
        - { name: tienda, in: query, schema: { type: string } }
      responses:
        '200': { description: Últimos 300 registros, content: { application/json: { schema: { $ref: '#/components/schemas/AuditoriaEquipo' } } } }
        '403': { $ref: '#/components/responses/Problema' }
components:
  responses:
    Problema:
      description: Error (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problema' }
  schemas:
    Plataforma:
      type: string
      enum: [tiendanube, shopify, woocommerce, mercadolibre, empretienda, csv]
    ImportacionNueva:
      type: object
      required: [plataforma]
      properties:
        plataforma: { $ref: '#/components/schemas/Plataforma' }
        url: { type: string, maxLength: 300, description: 'La dirección de la tienda vieja (http o https)' }
        credencial: { type: string, maxLength: 4096, description: 'Token o clave de la plataforma vieja si la fuente la pide. Se guarda cifrada y nunca vuelve; en la demo no se guarda' }
    ProgresoImportacion:
      type: object
      required: [productos, clientes, pedidos, redirecciones, repetidos, recortados]
      properties:
        productos: { type: integer }
        clientes: { type: integer }
        pedidos: { type: integer }
        redirecciones: { type: integer }
        repetidos: { type: integer, description: 'Lo que ya estaba (mismo email, SKU, URL o pedido)' }
        recortados: { type: integer, description: 'Lo que entró con algo cortado (textos largos, más de 8 fotos o de 100 líneas)' }
    ErrorImportacion:
      type: object
      required: [etapa, externo, detalle]
      properties:
        etapa: { type: string }
        externo: { type: string, description: 'El id en la plataforma vieja (vacío si el error es de la fuente)' }
        detalle: { type: string }
    Importacion:
      type: object
      required: [id, plataforma, urlOrigen, estado, etapa, progreso, errores, creada, terminada]
      properties:
        id: { type: string }
        plataforma: { $ref: '#/components/schemas/Plataforma' }
        urlOrigen: { type: string }
        estado: { type: string, enum: [pendiente, corriendo, lista, fallida, cancelada] }
        etapa: { type: string, enum: [productos, clientes, pedidos, redirecciones] }
        progreso: { $ref: '#/components/schemas/ProgresoImportacion' }
        errores: { type: array, maxItems: 50, description: 'Los últimos 50', items: { $ref: '#/components/schemas/ErrorImportacion' } }
        creada: { type: string, format: date-time }
        terminada: { type: [string, 'null'], format: date-time }
    PedidoHistorial:
      type: object
      required: [id, plataforma, numero, fecha, total, items, estado]
      properties:
        id: { type: string }
        plataforma: { $ref: '#/components/schemas/Plataforma' }
        numero: { type: string, description: 'El número en la plataforma vieja (#1043)' }
        fecha: { type: string, format: date-time }
        total: { type: integer, description: 'En pesos' }
        items:
          type: array
          items:
            type: object
            required: [nombre, variante, cantidad, precio]
            properties:
              nombre: { type: string }
              variante: { type: string }
              cantidad: { type: integer }
              precio: { type: integer }
        estado: { type: string, description: 'Tal como venía de la plataforma' }
    EstadoTelegram:
      type: object
      required: [vinculado]
      properties:
        vinculado: { type: boolean }
        nombre: { type: string, description: 'Nombre de quien vinculó el chat' }
        desde: { type: string, format: date-time }
    CodigoTelegram:
      type: object
      required: [codigo, venceEn]
      properties:
        codigo: { type: string, description: '8 letras y números (sin 0, 1, I ni O)' }
        venceEn: { type: string, format: date-time }
    ContextoTelegram:
      type: object
      required: [tienda, hoy, semana, contexto, usos]
      properties:
        tienda: { $ref: '#/components/schemas/Tienda' }
        hoy: { $ref: '#/components/schemas/Tablero' }
        semana: { $ref: '#/components/schemas/Tablero' }
        contexto: { $ref: '#/components/schemas/ContextoHornero' }
        usos: { type: integer, description: 'Mensajes a Hornero hoy (hora de Argentina), contando este' }
    ResumenPanel:
      type: object
      required: [insignias, notificaciones, canales, prueba]
      properties:
        insignias:
          type: object
          description: 'Números del menú (0: sin insignia)'
          required: [pedidos, carritos, whatsapp, paraHacer]
          properties:
            pedidos: { type: integer, description: 'Para preparar' }
            carritos: { type: integer, description: 'Carritos abandonados recuperables' }
            whatsapp: { type: integer, description: 'Conversaciones sin leer' }
            paraHacer: { type: integer, description: 'Tareas de hoy' }
        notificaciones:
          type: array
          description: 'La demo arma las suyas; con la API va vacía: la campanita lee /v1/panel/notificaciones'
          items: { $ref: '#/components/schemas/Notificacion' }
        canales:
          type: array
          description: 'Canales conectados (ids: wa, ml, mp, ig, tg)'
          items: { type: string }
        prueba:
          type: object
          required: [plan, diasRestantes, diasTotales]
          properties:
            plan: { type: string }
            diasRestantes: { type: integer }
            diasTotales: { type: integer }
    Comparado:
      type: object
      description: 'El valor del período y el del período anterior del mismo largo'
      required: [actual, anterior]
      properties:
        actual: { type: number }
        anterior: { type: number }
    ContextoHornero:
      type: object
      required: [ventasPorDia, productos, clientes, canales30d]
      properties:
        montos: { type: boolean, description: 'false: el rol no ve montos y no vienen las ventas en pesos' }
        ventasPorDia:
          type: array
          description: 'Últimos 14 días, del más viejo a hoy (hora de Argentina)'
          items:
            type: object
            required: [fecha, pedidos]
            properties:
              fecha: { type: string, format: date }
              ventas: { type: integer, description: 'No viene sin montos' }
              pedidos: { type: integer }
        productos:
          type: array
          items:
            type: object
            required: [nombre, categoria, precio, stock, vendidos30d, enMl]
            properties:
              nombre: { type: string }
              categoria: { type: [string, 'null'] }
              precio: { type: integer }
              stock: { type: integer }
              vendidos30d: { type: integer }
              enMl: { type: boolean }
        clientes:
          type: object
          required: [total, nuevos30d, conWhatsApp, sinVolver]
          properties:
            total: { type: integer }
            nuevos30d: { type: integer }
            conWhatsApp: { type: integer }
            sinVolver: { type: integer, description: 'Compraron más de una vez y hace 30 días que no vuelven' }
        canales30d:
          type: array
          items:
            type: object
            required: [canal, pedidos]
            properties:
              canal: { type: string }
              ventas: { type: integer, description: 'No viene sin montos' }
              pedidos: { type: integer }
        visitas:
          type: object
          description: 'Visitas de la tienda online (medición propia, sin cookies). No viene si todavía no se mide ninguna.'
          required: [medidasDesde, visitasPorDia, visitas30d, visitas30dAnteriores, paginasVistas30d, conversion30d, masVistos30d]
          properties:
            medidasDesde: { type: string, format: date }
            visitasPorDia:
              type: array
              items:
                type: object
                required: [fecha, visitas]
                properties:
                  fecha: { type: string, format: date }
                  visitas: { type: integer }
            visitas30d: { type: integer }
            visitas30dAnteriores: { type: integer }
            paginasVistas30d: { type: integer }
            conversion30d: { type: number, description: 'Pedidos web por cada 100 visitas' }
            masVistos30d:
              type: array
              items:
                type: object
                required: [nombre, vistas, visitas]
                properties:
                  nombre: { type: string }
                  vistas: { type: integer }
                  visitas: { type: integer }
    NombreLista:
      type: string
      enum: [clientes, productos, inventario, facturacion, envios]
    ListaGenerica:
      type: object
      required: [total, filas, segmentos, facetas, resumen]
      properties:
        total: { type: integer }
        filas:
          type: array
          description: 'Registros de la lista (la forma depende de la lista: ver FilaCliente, FilaProducto, …). Productos: cada fila trae `variantes: {id, texto, sku, precio, stock, activa}[]`. Inventario: `variantes: {id: "producto:variante", varianteId, texto, sku, stock, activa}[]` y el stock de la fila es el total; ajustar, ingreso y conteo aceptan esos ids'
          items: { type: object, additionalProperties: true }
        segmentos:
          type: object
          description: 'Conteo por segmento, sin el filtro de segmento'
          additionalProperties: { type: integer }
        facetas:
          type: object
          description: 'Por faceta, conteo de cada valor sin el filtro de esa faceta'
          additionalProperties: { type: object, additionalProperties: { type: integer } }
        resumen:
          type: object
          description: 'Números para el encabezado y la sugerencia de Hornero (dependen de la lista)'
          additionalProperties: { type: number }
    ProductoEditable:
      type: object
      required: [nombre, precio]
      properties:
        nombre: { type: string, minLength: 2, maxLength: 120 }
        descripcion: { type: string, maxLength: 4000 }
        categoria: { type: [string, 'null'], maxLength: 60 }
        precio: { type: integer, minimum: 0 }
        precioMayorista: { type: [integer, 'null'], minimum: 0, description: 'Precio con el carrito al mínimo mayorista (§49), menor que el precio. Al guardar: sin mandar (o null) queda el que había; 0 lo saca. En la ficha, null: no tiene' }
        costo: { type: integer, minimum: 0 }
        sku: { type: string, maxLength: 40 }
        stock: { type: integer, minimum: 0 }
        foto: { type: [string, 'null'], description: 'La portada (fotos[0]). Sin `fotos`: reemplaza la portada y deja el resto; null vacía la galería' }
        fotos:
          type: array
          maxItems: 8
          description: 'Galería: la primera es la portada (ids de foto o URLs https). Sin vacías; las repetidas se descartan'
          items: { type: string }
        opciones:
          type: array
          maxItems: 3
          description: 'Talle, Color, Presentación… Con opciones se vende por variante y el `stock` del producto se ignora (es la suma de las activas). Sin mandar: quedan las que había; [] las saca. Hasta 100 combinaciones; nombres y valores repetidos se comparan sin mayúsculas ni tildes'
          items: { $ref: '#/components/schemas/OpcionProducto' }
        variantes:
          type: array
          maxItems: 100
          description: 'Sólo las que se tocan, identificadas por sus valores. Al guardar se generan las combinaciones: las nuevas arrancan con stock 0 y activas; las que dejan de existir se borran'
          items: { $ref: '#/components/schemas/VarianteEditable' }
        canales:
          type: object
          description: 'Dónde se publica: web, ml, ig, google'
          additionalProperties: { type: boolean }
        tipo:
          type: [string, 'null']
          enum: [ropa, calzado, alimentos, belleza, hogar, tecnologia, otro, null]
          description: 'Qué es: según el tipo el editor pide talle y color, contenido, peso y medidas… Sin mandar (o null): queda el que había. En la ficha, null: no se eligió'
        atributos:
          type: object
          description: 'Los datos del tipo: peso (gramos), alto, ancho y largo (centímetros), contenido, material, marca, modelo, garantia. Textos de hasta 60 letras; los vacíos se descartan. Sin mandar: quedan los que había'
          additionalProperties: { type: string, maxLength: 60 }
    OpcionProducto:
      type: object
      required: [nombre, valores]
      properties:
        nombre: { type: string, minLength: 1, maxLength: 20 }
        valores:
          type: array
          minItems: 1
          maxItems: 20
          description: 'Sin repetidos'
          items: { type: string, minLength: 1, maxLength: 20 }
    VarianteEditable:
      type: object
      required: [valores]
      properties:
        valores:
          type: object
          description: 'Una clave por opción, con un valor de esa opción: identifica la combinación'
          additionalProperties: { type: string }
        sku: { type: string, maxLength: 40 }
        precio: { type: [integer, 'null'], minimum: 0, description: 'null: usa el precio del producto' }
        precioMayorista: { type: [integer, 'null'], minimum: 0, description: 'null: usa el precio mayorista del producto (§49)' }
        stock: { type: integer, minimum: 0, maximum: 1000000, description: 'Sin mandar: el que tenía (0 si es nueva)' }
        foto: { type: [string, 'null'], description: 'Una de las fotos del producto' }
        activa: { type: boolean, description: 'Sin mandar: la que tenía (true si es nueva)' }
    Variante:
      type: object
      required: [id, valores, sku, precio, stock, foto, activa]
      properties:
        id: { type: string }
        valores:
          type: object
          description: 'Una clave por opción del producto, con un valor de esa opción'
          additionalProperties: { type: string }
        sku: { type: string, maxLength: 40 }
        precio: { type: [integer, 'null'], minimum: 0, description: 'null: usa el precio del producto' }
        precioMayorista: { type: [integer, 'null'], minimum: 0, description: 'null: usa el precio mayorista del producto (§49)' }
        stock: { type: integer, minimum: 0 }
        foto: { type: [string, 'null'], description: 'Una de las fotos del producto' }
        activa: { type: boolean }
    Producto:
      allOf:
        - { $ref: '#/components/schemas/ProductoEditable' }
        - type: object
          required: [id, publicado, vendidos30d, slug, fotos, opciones, variantes, tipo, atributos]
          properties:
            id: { type: string }
            publicado: { type: boolean }
            vendidos30d: { type: integer }
            slug: { type: string }
            fotos: { type: array, items: { type: string } }
            opciones: { type: array, items: { $ref: '#/components/schemas/OpcionProducto' } }
            variantes: { type: array, description: 'En el orden de las combinaciones', items: { $ref: '#/components/schemas/Variante' } }
    MovimientoStock:
      type: object
      required: [tipo, texto, cantidad, en]
      properties:
        tipo: { type: string, enum: [web, local, ml, ajuste, conteo, ingreso, devolucion] }
        texto: { type: string }
        cantidad: { type: integer, description: 'Negativo: sale; positivo: entra' }
        en: { type: string, format: date-time }
    ConversacionBreve:
      type: object
      required: [id, nombre, foto, canal, ultimo, creado, atiende, sinLeer]
      properties:
        id: { type: string }
        nombre: { type: string }
        foto: { type: [string, 'null'] }
        canal: { type: string, enum: [wa, ig, tg, ml] }
        ultimo: { type: string, description: 'El último mensaje' }
        creado: { type: string, format: date-time }
        atiende: { type: string, enum: [hornero, vos, resuelto] }
        sinLeer: { type: integer }
    Conversacion:
      allOf:
        - { $ref: '#/components/schemas/ConversacionBreve' }
        - type: object
          required: [mensajes, sugerencia, tomada, cliente, clienteId]
          properties:
            clienteId: { type: [string, 'null'], description: 'Su ficha, para crearle un pedido' }
            mensajes:
              type: array
              items:
                type: object
                required: [de, texto, en]
                properties:
                  de: { type: string, enum: [cliente, hornero, vos] }
                  texto: { type: string }
                  en: { type: string, format: date-time }
                  producto:
                    type: [object, 'null']
                    description: 'Tarjeta de producto que mandó Hornero'
                    required: [nombre, foto, precio, stock]
                    properties:
                      nombre: { type: string }
                      foto: { type: [string, 'null'] }
                      precio: { type: integer }
                      stock: { type: integer }
            sugerencia: { type: [string, 'null'], description: 'Respuesta que propone Hornero' }
            tomada: { type: boolean, description: 'La atiende la persona (Hornero en pausa)' }
            cliente:
              type: object
              required: [ciudad, desde, gastado, pedidos, etiquetas, ultimoPedido, sabe]
              properties:
                ciudad: { type: string }
                desde: { type: string, format: date-time }
                gastado: { type: integer }
                pedidos: { type: integer }
                etiquetas: { type: array, items: { type: string } }
                ultimoPedido:
                  type: [object, 'null']
                  required: [numero, resumen, total, estado]
                  properties:
                    numero: { type: integer }
                    resumen: { type: string }
                    total: { type: integer }
                    estado: { $ref: '#/components/schemas/EstadoPedido' }
                sabe: { type: [string, 'null'], description: 'Lo que Hornero aprendió de esta persona' }
    AutomaticosCarritos:
      type: object
      required: [hora, dia, email]
      properties:
        hora: { type: boolean, description: 'WhatsApp a la hora' }
        dia: { type: boolean, description: 'Segundo aviso a las 24 h con 5% off' }
        email: { type: boolean, description: 'Email al tercer día' }
    Carritos:
      type: object
      required: [carritos, abiertos, monto, recuperado, tasa, costoMensaje, automaticos]
      properties:
        carritos:
          type: array
          items:
            type: object
            required: [id, nombre, foto, desde, creado, fotos, cantidad, total, recordado]
            properties:
              id: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              desde: { type: string, description: 'Por dónde llegó: la tienda, Instagram…' }
              creado: { type: string, format: date-time }
              fotos: { type: array, items: { type: [string, 'null'] } }
              cantidad: { type: integer }
              total: { type: integer }
              recordado: { type: boolean }
        abiertos: { type: integer }
        monto: { type: integer }
        recuperado: { type: integer, description: 'Recuperado este mes' }
        tasa: { type: number, description: 'Porcentaje recuperado (0–100)' }
        costoMensaje: { type: integer }
        automaticos: { $ref: '#/components/schemas/AutomaticosCarritos' }
    Newsletter:
      type: object
      required: [suscriptores, confirmados, pendientes, envios, hoy, tope, productos]
      properties:
        suscriptores:
          type: array
          items:
            type: object
            required: [id, email, origen, confirmado, creado, confirmadoEn]
            properties:
              id: { type: string }
              email: { type: string }
              origen: { type: string, enum: [tienda, checkout], description: 'El bloque del pie de la tienda o la casilla del checkout' }
              confirmado: { type: boolean }
              creado: { type: string, format: date-time }
              confirmadoEn: { type: [string, 'null'], format: date-time }
        confirmados: { type: integer }
        pendientes: { type: integer }
        envios: { type: array, items: { $ref: '#/components/schemas/EnvioNewsletter' } }
        hoy: { type: integer, description: 'Mails de novedades que salieron hoy (día de Argentina)' }
        tope: { type: integer, description: 'Tope diario por tienda' }
        productos:
          type: array
          description: 'Productos publicados que se pueden destacar (por nombre, hasta 300)'
          items:
            type: object
            required: [id, nombre, precio, foto]
            properties:
              id: { type: string }
              nombre: { type: string }
              precio: { type: integer }
              foto: { type: [string, 'null'] }
    EnvioNewsletter:
      type: object
      required: [id, asunto, creado, destinatarios, enviados, estado]
      properties:
        id: { type: string }
        asunto: { type: string }
        creado: { type: string, format: date-time }
        destinatarios: { type: integer }
        enviados: { type: integer }
        estado: { type: string, enum: [enviando, manana, enviado], description: 'manana: se llegó al tope del día y sigue mañana' }
    NovedadNueva:
      type: object
      required: [asunto, texto, productos]
      properties:
        asunto: { type: string, minLength: 3, maxLength: 120 }
        texto: { type: string, minLength: 10, maxLength: 5000 }
        productos: { type: array, maxItems: 4, items: { type: string }, description: 'Productos publicados destacados (con foto, precio y link)' }
    PedidoNuevo:
      type: object
      required: [items, pago, canal]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string }
              varianteId: { type: [string, 'null'], description: 'Obligatoria si el producto tiene opciones; activa y de ese producto' }
              cantidad: { type: integer, minimum: 1, maximum: 10000 }
        pago: { type: string, enum: [mp, tarjeta, payway, modo, uala, transf, efectivo] }
        canal: { type: string, enum: [pos, wa, web, ig, ml, tg] }
        envio: { type: string, enum: [retiro, andreani, oca, correo, moto, mercadoenvios], default: retiro }
        cliente: { type: [string, 'null'], maxLength: 80, description: 'Nombre (en el local suele no haber)' }
        clienteId: { type: [string, 'null'], maxLength: 80, description: 'Un cliente que ya existe (el nombre sale de su ficha)' }
        telefono: { type: [string, 'null'], maxLength: 30 }
        nota: { type: [string, 'null'], maxLength: 300 }
        pagado: { type: boolean, default: true, description: 'false: queda Sin pagar (se cobra con un link)' }
    Devolucion:
      type: object
      required: [id, producto, foto, cliente, pedido, creada, motivo, monto, resolucion, estado]
      properties:
        id: { type: string }
        producto: { type: string }
        foto: { type: [string, 'null'] }
        cliente: { type: string }
        pedido: { type: integer }
        creada: { type: string, format: date-time }
        motivo: { type: string }
        monto: { type: integer }
        resolucion: { type: string, description: 'Lo que pidió: reintegro, reemplazo, cambio' }
        estado: { type: string, enum: [Pendiente, Aprobada, Cambio ofrecido] }
    ResenasYPreguntas:
      type: object
      required: [preguntas, resenas, promedio, total, porEstrellas, recomendaria]
      properties:
        preguntas:
          type: array
          items:
            type: object
            required: [id, producto, foto, pregunta, creada, sugerida, respuesta]
            properties:
              id: { type: string, description: 'Las de la tienda online empiezan con "t-"; las demás son de Mercado Libre' }
              producto: { type: string }
              foto: { type: [string, 'null'] }
              pregunta: { type: string }
              creada: { type: string, format: date-time }
              sugerida: { type: string, description: 'La respuesta que propone Hornero' }
              respuesta: { type: [string, 'null'], description: 'La publicada' }
        resenas:
          type: array
          items:
            type: object
            required: [id, autor, estrellas, texto, origen, creada, producto, conCompra, oculta, respuesta]
            properties:
              id: { type: string }
              autor: { type: string }
              estrellas: { type: integer }
              texto: { type: string }
              origen: { type: string, description: 'Tienda, Mercado Libre, Google' }
              creada: { type: string, format: date-time }
              producto: { type: [string, 'null'], description: 'El producto reseñado (si sigue existiendo)' }
              conCompra: { type: boolean, description: 'La dejó quien compró: trajo el código de un pedido cobrado' }
              oculta: { type: boolean, description: 'La tienda la ocultó (no se borra)' }
              respuesta: { type: [string, 'null'], description: 'La respuesta pública de la tienda' }
        promedio: { type: [number, 'null'] }
        total: { type: integer }
        porEstrellas: { type: array, items: { type: integer }, description: 'De 5 a 1 estrella' }
        recomendaria: { type: integer, description: 'Porcentaje (4 y 5 estrellas)' }
    LinkPublico:
      type: object
      required: [codigo, tienda, concepto, monto, cuotas, pagado, pedido]
      properties:
        codigo: { type: string }
        tienda: { type: string }
        concepto: { type: string }
        monto: { type: integer }
        cuotas: { type: boolean }
        pagado: { type: boolean }
        pedido: { type: [integer, 'null'] }
    ListasPrecio:
      type: object
      required: [listas, productos, muestra, programado]
      properties:
        listas:
          type: array
          items:
            type: object
            required: [id, nombre, quien, ajuste, detalle]
            properties:
              id: { type: string, enum: [minorista, mayorista, ml, revendedoras] }
              nombre: { type: string }
              quien: { type: string }
              ajuste: { type: integer, description: 'Porcentaje sobre el precio base (0 = base)' }
              detalle: { type: string }
        productos: { type: integer, description: 'Cuántos productos toca un aumento' }
        muestra:
          type: array
          items:
            type: object
            required: [id, nombre, precio]
            properties:
              id: { type: string }
              nombre: { type: string }
              precio: { type: integer }
        programado:
          type: [object, 'null']
          required: [pct, redondeo, para]
          properties:
            pct: { type: integer }
            redondeo: { type: string, enum: ['no', '90', '500'] }
            para: { type: string, format: date-time }
    Cupon:
      type: object
      required: [id, codigo, tipo, valor, descripcion, estado, usos, limite, vendio, desconto, canales, empieza, termina, minimo, consejo, creado]
      properties:
        id: { type: string }
        codigo: { type: string }
        tipo: { type: string, enum: [pct, fijo, envio, regalo] }
        valor: { type: integer, description: 'Porcentaje o pesos (0 en envío y regalo)' }
        descripcion: { type: string }
        estado: { type: string, enum: [activo, programado, pausado, terminado] }
        usos: { type: integer }
        limite: { type: integer, description: '0 = sin límite' }
        vendio: { type: integer }
        desconto: { type: integer }
        canales: { type: array, items: { type: string, enum: [web, wa, ig, pos] } }
        empieza: { type: [string, 'null'], format: date-time }
        termina: { type: [string, 'null'], format: date-time }
        minimo: { type: integer }
        consejo: { type: [string, 'null'], description: 'Lo que sugiere Hornero' }
        creado: { type: string, format: date-time }
    CuponNuevo:
      type: object
      required: [codigo, tipo, valor, alcance, quien, minimo, limite, porCliente, vigencia, canales, opciones]
      properties:
        codigo: { type: string, pattern: '^[A-Z0-9-]{3,20}$' }
        tipo: { type: string, enum: [pct, fijo, envio, regalo] }
        valor: { type: integer, minimum: 0, maximum: 100000 }
        alcance: { type: string, enum: [todo, categoria, productos] }
        productos: { type: array, maxItems: 50, items: { type: string } }
        quien: { type: string, enum: [todos, nuevos, vip, riesgo] }
        minimo: { type: integer, minimum: 0 }
        limite: { type: integer, minimum: 0 }
        porCliente: { type: string, enum: ['1', '3', libre] }
        vigencia: { type: string, enum: ['7', finde, '30', hotsale, sin] }
        canales: { type: array, minItems: 1, items: { type: string, enum: [web, wa, ig, pos] } }
        opciones:
          type: object
          required: [hornero, combinable, unicos, link]
          properties:
            hornero: { type: boolean }
            combinable: { type: boolean }
            unicos: { type: boolean }
            link: { type: boolean }
        programar: { type: boolean, default: false }
    Automatica:
      type: object
      required: [id, titulo, detalle, ejemplo, estado, aporte, activa]
      properties:
        id: { type: string, enum: [transf, envio, cantidad, '3x2', cuotas, mayorista, carrito, cumple] }
        titulo: { type: string }
        detalle: { type: string }
        ejemplo: { type: string }
        estado: { type: string }
        aporte: { type: [integer, 'null'], description: 'Lo que vendió con esta promo este mes' }
        activa: { type: boolean }
    Cupones:
      type: object
      required: [cupones, kpis, consejo, segmentos, automaticas, relampago, tienda, productos, categoria]
      properties:
        cupones: { type: array, items: { $ref: '#/components/schemas/Cupon' } }
        kpis:
          type: object
          required: [activos, usosMes, vendido, descontado, vsMesAnterior]
          properties:
            activos: { type: integer }
            usosMes: { type: integer }
            vendido: { type: integer }
            descontado: { type: integer }
            vsMesAnterior: { type: [integer, 'null'], description: 'Porcentaje' }
        consejo:
          type: [object, 'null']
          required: [cuponId, codigo, titulo, texto, minimo]
          properties:
            cuponId: { type: string }
            codigo: { type: string }
            titulo: { type: string }
            texto: { type: string }
            minimo: { type: integer }
        segmentos:
          type: object
          required: [vip, riesgo]
          properties:
            vip: { type: integer }
            riesgo: { type: integer }
        automaticas: { type: array, items: { $ref: '#/components/schemas/Automatica' } }
        relampago:
          type: object
          required: [vivo, proximas]
          properties:
            vivo:
              type: [object, 'null']
              required: [producto, foto, pct, precio, oferta, termina, vendidos, unidades, terminada]
              properties:
                producto: { type: string }
                foto: { type: [string, 'null'] }
                pct: { type: integer }
                precio: { type: integer }
                oferta: { type: integer }
                termina: { type: string, format: date-time }
                vendidos: { type: integer }
                unidades: { type: integer }
                terminada: { type: boolean }
            proximas:
              type: array
              items:
                type: object
                required: [titulo, detalle, cuando, foto]
                properties:
                  titulo: { type: string }
                  detalle: { type: string }
                  cuando: { type: string }
                  foto: { type: [string, 'null'] }
        tienda: { type: string }
        productos:
          type: array
          description: Para elegir a qué productos aplica
          items:
            type: object
            required: [id, nombre, foto]
            properties:
              id: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
        categoria: { type: [string, 'null'], description: 'La categoría que más vende (alcance "una categoría")' }
    Campana:
      type: object
      required: [id, canal, titulo, detalle, estado, metricas]
      properties:
        id: { type: string }
        canal: { type: string, enum: [wa, email] }
        titulo: { type: string }
        detalle: { type: string }
        estado: { type: string, enum: [Enviando, Programada, Activa, Terminada] }
        metricas:
          type: array
          items:
            type: object
            required: [k, v]
            properties:
              k: { type: string }
              v: { type: string }
    Marketing:
      type: object
      required: [tienda, audiencias, costoMensaje, retorno, mensajes, producto, cupon, campanas, cupones]
      properties:
        tienda:
          type: object
          required: [nombre, foto]
          properties:
            nombre: { type: string }
            foto: { type: [string, 'null'] }
        audiencias:
          type: array
          items:
            type: object
            required: [id, nombre, cantidad]
            properties:
              id: { type: string, enum: [todos, vip, riesgo, categoria] }
              nombre: { type: string }
              cantidad: { type: integer }
        costoMensaje: { type: integer, description: 'Pesos por mensaje de marketing de WhatsApp' }
        retorno: { type: [number, 'null'], description: 'Ventas por cada peso, según campañas anteriores' }
        mensajes: { type: array, items: { type: string }, description: 'Lo que propone Hornero; {nombre} se reemplaza' }
        producto:
          type: [object, 'null']
          required: [nombre, foto]
          properties:
            nombre: { type: string }
            foto: { type: [string, 'null'] }
        cupon: { type: [string, 'null'], description: 'El cupón que se puede adjuntar' }
        campanas: { type: array, items: { $ref: '#/components/schemas/Campana' } }
        cupones:
          type: array
          items:
            type: object
            required: [codigo, descripcion, usos]
            properties:
              codigo: { type: string }
              descripcion: { type: string }
              usos: { type: string }
    Canales:
      type: object
      required: [mes, canales]
      properties:
        mes: { type: string }
        canales:
          type: array
          items:
            type: object
            required: [id, nombre, vendido, pedidos, comision, nota, activo, conectado]
            properties:
              id: { type: string, enum: [web, wa, ml, pos, ig, tg, gg, tk] }
              nombre: { type: string }
              vendido: { type: integer }
              pedidos: { type: integer }
              comision: { type: number, description: '0,14 = 14 %' }
              nota: { type: string }
              activo: { type: boolean }
              conectado: { type: boolean }
    Informes:
      type: object
      required: [meses, series, kpis, historia, insights]
      properties:
        meses: { type: array, items: { type: string } }
        series:
          type: object
          required: [ventas, productos, clientes, margen]
          properties:
            ventas: { type: array, items: { type: integer } }
            productos: { type: array, items: { type: integer } }
            clientes: { type: array, items: { type: integer } }
            margen: { type: array, items: { type: [integer, 'null'] } }
            visitas:
              type: array
              description: 'Visitas por mes (medición propia); null antes de empezar a medir. No viene si todavía no se mide ninguna.'
              items: { type: [integer, 'null'] }
        kpis:
          type: object
          required: [ventas, ventasVs, ticket, ticketVs, margen, margenVs, ahorro, mesAnterior]
          properties:
            ventas: { type: integer }
            ventasVs: { type: [number, 'null'] }
            ticket: { type: integer }
            ticketVs: { type: [number, 'null'] }
            margen: { type: [integer, 'null'] }
            margenVs: { type: [integer, 'null'] }
            ahorro: { type: integer, description: 'Comisiones que no pagó contra una plataforma con comisión' }
            mesAnterior: { type: string }
        historia: { type: integer, description: 'Meses de historia' }
        insights: { type: array, items: { type: string } }
    Evento:
      type: object
      required: [id, tipo, quien, rol, categoria, foto, texto, cuando, donde, deshacer, deshecho]
      properties:
        id: { type: string }
        tipo: { type: string, enum: [equipo, ia, hornero, soporte, sistema], description: 'Quién: persona del equipo, IA conectada, Tincho, soporte de Tu Local Web o el sistema' }
        quien: { type: string, description: '«Vos», el nombre de la persona o «Claude (conectada por Leo)»' }
        rol: { type: [string, 'null'], description: 'Rol de la persona en ese momento (Dueña, Administración, Ventas, Local)' }
        categoria: { $ref: '#/components/schemas/CategoriaEvento' }
        foto: { type: [string, 'null'] }
        texto: { type: string }
        cuando: { type: string, format: date-time }
        donde: { type: string }
        deshacer: { type: boolean, description: 'Se puede volver atrás' }
        deshecho: { type: boolean }
    CategoriaEvento:
      type: string
      description: De qué se trata (el filtro «Tipo» de Actividad).
      enum: [producto, pedido, venta, promocion, cobros, negocio, envios, dominio, integracion, personas, plan, datos, sesion, mitienda, soporte, otro]
    ParaHacer:
      type: object
      required: [grupos]
      properties:
        grupos:
          type: array
          items:
            type: object
            required: [titulo, tareas]
            properties:
              titulo: { type: string, enum: [Urgente, Hoy, Esta semana] }
              tareas:
                type: array
                items:
                  type: object
                  required: [id, tipo, titulo, detalle, valor, accion, hecha]
                  properties:
                    id: { type: string }
                    tipo: { type: string, enum: [preparar, chats, carritos, transferencias, certificado, reponer] }
                    titulo: { type: string }
                    detalle: { type: string }
                    valor: { type: [integer, 'null'], description: 'Lo que mueve, en pesos' }
                    aproximado: { type: boolean }
                    accion: { type: string }
                    hecha: { type: boolean }
    Finanzas:
      type: object
      required: [disponible, cuenta, banco, caja, kpis, flujo, movimientos, conciliado]
      properties:
        vendido30: { type: integer, description: 'Vendido y cobrado en los últimos 30 días, en pesos' }
        disponible: { type: [integer, 'null'], description: 'En Mercado Pago, listo para transferir (null: no se trae)' }
        cuenta: { type: [string, 'null'], description: 'Cómo se muestra la cuenta de cobro (CBU terminada en…)' }
        banco: { type: [string, 'null'] }
        caja:
          type: [object, 'null']
          description: null si Caja no está conectada
          required: [ventas, liquidaciones, gastos, meta, metaPct, falta, sincronizado]
          properties:
            ventas: { type: integer }
            liquidaciones: { type: integer }
            gastos: { type: integer }
            meta: { type: string }
            metaPct: { type: integer }
            falta: { type: integer }
            sincronizado: { type: string, format: date-time }
        kpis:
          type: object
          required: [aLiquidar, aLiquidarDetalle, gastos, gastosDetalle, ganancia, gananciaDetalle, margen, mes]
          properties:
            aLiquidar: { type: [integer, 'null'] }
            aLiquidarDetalle: { type: string }
            gastos: { type: [integer, 'null'] }
            gastosDetalle: { type: string }
            ganancia: { type: [integer, 'null'], description: 'null si a algo vendido le falta el costo (no se estima)' }
            gananciaDetalle: { type: string, description: 'Por qué no hay ganancia ("Falta el costo de 2 productos vendidos"); vacío si la hay' }
            margen: { type: [integer, 'null'] }
            mes: { type: string }
        flujo:
          type: array
          description: Próximos 14 días
          items:
            type: object
            required: [dia, entra, sale]
            properties:
              dia: { type: integer }
              entra: { type: integer }
              sale: { type: integer }
        movimientos:
          type: array
          items:
            type: object
            required: [id, tipo, titulo, detalle, monto]
            properties:
              id: { type: string }
              tipo: { type: string, enum: [mp, payway, modo, uala, andreani, oca, correo, moto, transf, gasto, retiro] }
              titulo: { type: string }
              detalle: { type: string }
              monto: { type: integer, description: 'Positivo entra, negativo sale' }
        conciliado: { type: boolean }
    DisenoTienda:
      type: object
      required: [secciones, paleta]
      properties:
        secciones:
          type: array
          minItems: 6
          maxItems: 6
          items:
            type: object
            required: [id, visible]
            properties:
              id: { type: string, enum: [hero, cats, prods, revs, ig, wa] }
              visible: { type: boolean }
        paleta: { type: integer, minimum: 0, maximum: 3 }
        plantilla: { type: string, description: 'Id de la plantilla a la que se cambia al publicar (vacío o ausente: la de siempre)' }
        titulo: { type: string, maxLength: 80, description: 'Título de la portada (vacío: el nombre de la tienda)' }
        lema: { type: string, maxLength: 120, description: 'Lema bajo el título de la portada' }
        portada: { type: string, maxLength: 300, description: 'URL de la foto de portada (vacío: la de un producto)' }
        logo: { type: string, maxLength: 300, description: 'URL del logo (vacío: el nombre en letras)' }
        compartirTitulo: { type: string, maxLength: 70, description: 'Título de la vista previa al compartir la tienda (vacío: el sugerido)' }
        compartirDescripcion: { type: string, maxLength: 160, description: 'Descripción de la vista previa al compartir (vacío: la sugerida)' }
        compartirFoto: { type: string, maxLength: 300, description: 'URL de una foto propia para compartir (vacío: la imagen armada con la plantilla)' }
        estilo: { $ref: '#/components/schemas/EstiloTienda' }
    EstiloTienda:
      type: object
      description: 'Mi tienda › Estilo: colores por rol y por zona, tipografías, logos, anuncio, textos y redes. Todo opcional: vacío es lo de la plantilla (lib/tienda/estilo/estilo.ts)'
      properties:
        colores:
          type: object
          additionalProperties: false
          properties:
            fondo: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            superficie: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            texto: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            textoSuave: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            borde: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            acento: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            sobreAcento: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            encabezado: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            encabezadoTexto: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            pie: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
            pieTexto: { type: string, pattern: '^(#[0-9A-Fa-f]{6})?$' }
        fuenteTitulos: { type: string, maxLength: 40, description: 'Id de lib/tienda/estilo/fuentes.ts' }
        fuenteTexto: { type: string, maxLength: 40 }
        logoOscuro: { type: string, maxLength: 300 }
        icono: { type: string, maxLength: 300 }
        logoAlto: { type: integer, minimum: 0, maximum: 72 }
        anuncio: { type: string, maxLength: 120 }
        anuncioLink: { type: string, maxLength: 300 }
        leyendaPie: { type: string, maxLength: 160 }
        textos:
          type: object
          additionalProperties: false
          properties:
            cats: { type: string, maxLength: 60 }
            prods: { type: string, maxLength: 60 }
            revs: { type: string, maxLength: 60 }
            ig: { type: string, maxLength: 60 }
            wa: { type: string, maxLength: 60 }
        redes:
          type: object
          additionalProperties: false
          properties:
            instagram: { type: string, maxLength: 60 }
            tiktok: { type: string, maxLength: 60 }
            facebook: { type: string, maxLength: 100 }
            youtube: { type: string, maxLength: 100 }
            email: { type: string, maxLength: 120 }
            telefono: { type: string, maxLength: 30 }
        menu:
          type: array
          maxItems: 8
          description: 'Pestañas del menú (vacío: las de la plantilla). a: inicio, catalogo, nosotros, turnos, suscripciones, cat:<categoría> o https://…'
          items:
            type: object
            required: [t, a]
            properties:
              t: { type: string, minLength: 1, maxLength: 30 }
              a: { type: string, maxLength: 300 }
    Tarjeta:
      type: object
      description: 'La tarjeta A6 para los paquetes (pieza 7a de Imprimibles). Los textos aceptan {nombre}, {fecha}, {productos} y {pedido}'
      required: [modelo, titulo, mensaje, dorsoTitulo, dorsoTexto, qr, cupon, instagram]
      properties:
        modelo: { type: string, enum: [arco, sello, carta] }
        titulo: { type: string, minLength: 1, maxLength: 40 }
        mensaje: { type: string, maxLength: 140 }
        dorsoTitulo: { type: string, maxLength: 40 }
        dorsoTexto: { type: string, maxLength: 140 }
        qr: { type: string, enum: [resena, cupon, instagram, whatsapp] }
        cupon: { type: string, pattern: '^[A-Z0-9-]{0,20}$' }
        instagram: { type: string, pattern: '^[a-zA-Z0-9._]{0,30}$' }
    MiTienda:
      type: object
      required: [plantilla, plantillaId, direccion, diseno, sinPublicar, vista]
      properties:
        plantilla: { type: string }
        plantillaId: { type: string, description: 'La plantilla del borrador (o la de la tienda)' }
        direccion: { type: string, description: 'Dónde se ve la tienda (dominio o dirección de Tu Local Web)' }
        diseno: { $ref: '#/components/schemas/DisenoTienda' }
        sinPublicar: { type: boolean }
        vista:
          type: object
          required: [tienda, categorias, productos, resena, fotos, portada]
          properties:
            tienda: { type: string }
            categorias: { type: array, items: { type: string } }
            productos:
              type: array
              items:
                type: object
                required: [nombre, foto, precio]
                properties:
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  precio: { type: integer }
            resena:
              type: [object, 'null']
              required: [promedio, texto]
              properties:
                promedio: { type: number }
                texto: { type: string }
            fotos: { type: array, items: { type: string } }
            portada:
              type: object
              required: [foto, titulo]
              properties:
                foto: { type: [string, 'null'] }
                titulo: { type: string }
                lema: { type: string }
            logo: { type: string }
    Negocio:
      type: object
      required: [nombre, razonSocial, cuit, condicion, direccion, whatsapp, email, horario]
      properties:
        nombre: { type: string, maxLength: 80 }
        razonSocial: { type: string, maxLength: 120 }
        cuit: { type: string, maxLength: 13 }
        condicion: { type: string, maxLength: 60 }
        direccion: { type: string, maxLength: 160 }
        whatsapp: { type: string, maxLength: 30 }
        email: { type: string, maxLength: 120 }
        horario: { type: string, maxLength: 80 }
        alias: { type: string, maxLength: 20, pattern: '^([a-zA-Z0-9.-]{6,20})?$', description: 'Alias para cobrar por transferencia (6 a 20 caracteres; vacío si no hay)' }
        cbu: { type: string, maxLength: 22, pattern: '^([0-9]{22})?$', description: 'CBU o CVU de 22 dígitos, con sus verificadores (vacío si no hay)' }
        titular: { type: string, maxLength: 80 }
        politica: { type: string, maxLength: 1000, description: 'Política de cambios y devoluciones que se muestra en la tienda (vacía: el texto legal base)' }
    Dispositivo:
      type: object
      description: >-
        Un teléfono para los avisos push. En el iPhone (APNs) el payload tiene aps.alert (title/body),
        sound, thread-id (tienda-<id>, o cuenta), category (venta: Ver pedido y Marcar como preparado) y,
        afuera de aps, ruta (pedido/<numero>, preguntas/ml/<id>, cuenta/seguridad) y tienda (el id) para
        abrir la pantalla. En Android (FCM) llega sólo con datos: titulo, cuerpo, ruta, tienda, hilo y
        categoria; los pedidos por preparar, con tipo actividad.
      required: [token]
      properties:
        token: { type: string, maxLength: 4096, description: 'Token de APNs en hexadecimal (iPhone) o de registro de FCM (Android)' }
        plataforma: { type: string, enum: [ios, android], default: ios }
        entorno: { type: string, enum: [sandbox, produccion], default: produccion, description: sandbox para la app instalada desde Xcode }
        modelo: { type: string, maxLength: 60, description: 'Por ejemplo, iPhone15,2' }
        version: { type: string, maxLength: 30, description: Versión de la app }
    EstadoPushWeb:
      type: object
      required: [clave, suscripta]
      properties:
        clave: { type: string, description: 'Clave pública VAPID en base64url (applicationServerKey); vacía si el push web está apagado' }
        suscripta: { type: boolean, description: Si esta sesión ya tiene una suscripción }
    SuscripcionWeb:
      type: object
      description: >-
        Lo que da PushSubscription.toJSON() en el navegador (endpoint y keys.p256dh, keys.auth), más
        cómo se ve el aparato. El aviso que llega es JSON con title, body, url (la página del panel),
        tienda y tag.
      required: [endpoint, p256dh, auth]
      properties:
        endpoint: { type: string, format: uri, maxLength: 1000 }
        p256dh: { type: string, description: Clave pública P-256 del navegador en base64url }
        auth: { type: string, description: Secreto de 16 bytes en base64url }
        aparato: { type: string, maxLength: 60, description: 'Por ejemplo, iPhone · Safari' }
    Miembro:
      type: object
      required: [id, nombre, contacto, rol, foto, ultimo, pendiente, vence, vos, dobleFactor]
      properties:
        id: { type: string }
        nombre: { type: string }
        contacto: { type: string }
        rol: { type: string, enum: [duenio, admin, ventas, local] }
        foto: { type: [string, 'null'] }
        ultimo: { type: [string, 'null'], format: date-time }
        pendiente: { type: boolean, description: 'Invitación sin aceptar' }
        vence: { type: [string, 'null'], format: date-time, description: 'Invitación: cuándo vence el link (null si nunca se mandó)' }
        vos: { type: boolean }
        dobleFactor: { type: boolean }
    VentaMayorista:
      type: object
      required: [activa, unidades, monto]
      description: 'Configuración › Venta mayorista (§49): con el carrito al mínimo, los productos con precio mayorista pasan a ese precio'
      properties:
        activa: { type: boolean }
        unidades: { type: [integer, 'null'], minimum: 2, maximum: 10000, description: 'Mínimo de unidades en el carrito (null: sin mínimo de unidades)' }
        monto: { type: [integer, 'null'], minimum: 1, maximum: 100000000, description: 'Mínimo del carrito en pesos, a precio minorista (null: sin mínimo de monto)' }
    Configuracion:
      type: object
      required: [negocio, equipo, seguridad, sesiones, avisos, plan, mayorista]
      properties:
        negocio: { $ref: '#/components/schemas/Negocio' }
        mayorista: { $ref: '#/components/schemas/VentaMayorista' }
        equipo: { type: array, items: { $ref: '#/components/schemas/Miembro' } }
        seguridad:
          type: object
          description: Opciones de la persona que mira (no de la tienda).
          required: [avisoIngreso, inactivas]
          properties:
            avisoIngreso: { type: boolean, description: 'Mail «Entraron a tu cuenta» con cada sesión nueva' }
            inactivas: { type: boolean, description: 'Una sesión sin usar hace 7 días deja de valer' }
        sesiones:
          type: array
          description: Todas las sesiones vigentes de la persona, la actual primero.
          items:
            type: object
            required: [id, tipo, nombre, ubicacion, ip, creada, cuando, actual]
            properties:
              id: { type: string }
              tipo: { type: string, enum: [compu, celu, tablet, caja] }
              nombre: { type: string, description: 'Navegador y sistema: «Chrome en Mac»' }
              ubicacion: { type: string, description: '«Ciudad, Provincia» o el país, según la IP. Vacía si no se sabe.' }
              ip: { type: string, description: IP abreviada; vacía si no hay }
              creada: { type: string, format: date-time }
              cuando: { type: string, format: date-time, description: Última vez que se usó }
              actual: { type: boolean }
        avisos:
          type: object
          required: [venta, chats, stock, diario, ideas, novedades]
          properties:
            venta: { type: boolean }
            chats: { type: boolean }
            stock: { type: boolean }
            diario: { type: boolean }
            ideas: { type: boolean }
            novedades: { type: boolean }
        plan:
          type: object
          required: [actual, ciclo, enPrueba, diasPrueba]
          properties:
            actual: { type: string, enum: [gratis, emprende, pro, negocio] }
            ciclo: { type: string, enum: [mes, anio] }
            enPrueba: { type: boolean }
            diasPrueba: { type: integer }
    PlanCuenta:
      type: object
      required: [actual, ciclo, enPrueba, diasPrueba, finPrueba, proximoCobro, abono, cotizaciones, beneficio, beneficioUsado, uso, medio, facturacion, facturas, cancelado]
      properties:
        actual: { type: string, enum: [gratis, emprende, pro, negocio] }
        ciclo: { type: string, enum: [mes, anio] }
        enPrueba: { type: boolean }
        diasPrueba: { type: integer }
        finPrueba: { type: string, format: date-time }
        proximoCobro: { type: [string, 'null'], format: date-time, description: 'El próximo cobro del débito; en la prueba, cuando termina' }
        abono:
          type: object
          required: [activo, proximo, programado]
          properties:
            activo: { type: boolean, description: 'Hay un débito autorizado en Mercado Pago' }
            proximo: { type: [string, 'null'], format: date-time, description: 'Hasta cuándo está pago el plan vigente' }
            programado:
              type: [object, 'null']
              required: [plan, ciclo, desde]
              properties:
                plan: { type: string, enum: [gratis, emprende, pro, negocio] }
                ciclo: { type: string, enum: [mes, anio] }
                desde: { type: string, format: date-time }
        cotizaciones:
          type: object
          description: 'Lo que cuesta pasar a cada plan, por "plan/ciclo" (abono.Cotizar). Falta la de un cambio no permitido.'
          additionalProperties: { $ref: '#/components/schemas/Cotizacion' }
        beneficio:
          type: [object, 'null']
          description: 'El descuento para quedarse (§57) que queda en los próximos cobros del débito'
          required: [pct, cobros]
          properties:
            pct: { type: integer }
            cobros: { type: integer, description: 'Cobros que quedan con el descuento' }
        beneficioUsado: { type: boolean, description: 'Ya se aceptó el descuento alguna vez (se ofrece una sola vez)' }
        uso:
          type: object
          required: [productos, personas, hornero, packs, sinIa]
          properties:
            productos: { type: integer }
            personas: { type: integer }
            hornero: { type: integer, description: 'Respuestas con IA este mes' }
            packs: { type: integer }
            sinIa: { type: integer }
        medio:
          type: [object, 'null']
          required: [marca, ultimos, vence]
          properties:
            marca: { type: string }
            ultimos: { type: string }
            vence: { type: string }
        facturacion:
          type: object
          required: [razonSocial, cuit, tipo]
          properties:
            razonSocial: { type: string }
            cuit: { type: string }
            tipo: { type: string }
        facturas:
          type: array
          items:
            type: object
            required: [numero, detalle, total]
            properties:
              numero: { type: string }
              detalle: { type: string }
              total: { type: integer }
              fecha: { type: string, format: date-time }
        cancelado:
          type: [object, 'null']
          required: [hasta]
          properties:
            hasta: { type: string, format: date-time }
    Cotizacion:
      type: object
      description: 'Pasar a plan/ciclo: qué se paga hoy (con su detalle), desde cuándo rige y cuánto se cobra después. Pesos, IVA incluido.'
      required: [plan, ciclo, tipo, hoy, rige, hasta, cobro, porCiclo, lineas, pago, inicio]
      properties:
        plan: { type: string, enum: [gratis, emprende, pro, negocio] }
        ciclo: { type: string, enum: [mes, anio] }
        tipo: { type: string, enum: [actual, prueba, alta, sube, baja, ciclo, gratis, programado, mantener] }
        hoy: { type: integer }
        rige: { type: string, format: date-time }
        hasta: { type: [string, 'null'], format: date-time }
        cobro:
          type: [object, 'null']
          required: [fecha, importe]
          properties:
            fecha: { type: string, format: date-time }
            importe: { type: integer }
        porCiclo: { type: integer }
        lineas:
          type: array
          items:
            type: object
            required: [texto, importe]
            properties:
              texto: { type: string }
              importe: { type: integer }
        pago: { type: string, enum: [ninguno, suscripcion, diferencia, actualizar, cancelar] }
        inicio: { type: [string, 'null'], format: date-time }
    UrlExterna:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
    Entregas:
      type: object
      required: [retiro, retiroDireccion, retiroHorario, moto, motoCosto, motoZona, motoDemora]
      properties:
        retiro: { type: boolean, description: 'Se puede retirar en el local' }
        retiroDireccion: { type: string, maxLength: 160, description: 'Dónde se retira; vacío: la dirección del negocio' }
        retiroHorario: { type: string, maxLength: 80, description: 'Cuándo se retira; vacío: el horario del negocio' }
        moto: { type: boolean, description: 'Envío propio en moto' }
        motoCosto: { type: integer, minimum: 0, maximum: 1000000, description: 'Costo fijo de la moto, en pesos' }
        motoZona: { type: string, maxLength: 160, description: 'Barrios o localidades adonde llega (obligatoria con moto)' }
        motoDemora: { type: string, maxLength: 60, description: 'Cuánto tarda, en texto (En el día, 24 a 48 h)' }
    EstadoEntregas:
      allOf:
        - { $ref: '#/components/schemas/Entregas' }
        - type: object
          required: [correo, gratisDesde]
          properties:
            correo: { type: boolean, description: 'La cuenta de MiCorreo está conectada (se configura en Integraciones)' }
            gratisDesde: { type: [integer, 'null'], description: 'Envío gratis desde este monto (promoción automática prendida en Cupones)' }
    SenaPedido:
      type: [object, 'null']
      description: 'El pedido se reservó o encargó con seña (§52); null si se paga entero. falta = total − seña (0 si ya se saldó).'
      required: [tipo, monto, falta, pagada, saldado]
      properties:
        tipo: { type: string, enum: [reserva, encargo] }
        monto: { type: integer }
        falta: { type: integer }
        pagada: { type: boolean }
        saldado: { type: boolean }
        vence: { type: [string, 'null'], format: date-time, description: 'Hasta cuándo se espera el pago de la seña' }
    LanzamientoEditable:
      type: object
      required: [lanzamiento, reserva, encargo, ofertaPrecio, ofertaHasta]
      properties:
        lanzamiento: { type: [string, 'null'], format: date-time, description: 'Cuándo sale a la venta (hora de Argentina en el panel)' }
        reserva: { type: [integer, 'null'], minimum: 1, maximum: 100, description: '% de seña para reservar antes del lanzamiento' }
        encargo: { type: [integer, 'null'], minimum: 1, maximum: 100, description: '% de seña para encargarlo (el resto al retirar)' }
        ofertaPrecio: { type: [integer, 'null'], description: 'Precio de oferta (el de lista sigue en el producto)' }
        ofertaHasta: { type: [string, 'null'], format: date-time }
    LanzamientoProducto:
      allOf:
        - { $ref: '#/components/schemas/LanzamientoEditable' }
        - type: object
          required: [avisos, avisados, reservas, encargos]
          properties:
            avisos: { type: integer, description: 'Cuántos pidieron «Avisame cuando salga»' }
            avisados: { type: integer, description: 'A cuántos ya les salió el mail' }
            reservas: { type: integer, description: 'Pedidos con seña de reserva (sin los cancelados)' }
            encargos: { type: integer }
    Medicion:
      type: object
      required: [ga4, pixel, feeds]
      properties:
        ga4: { type: [string, 'null'], pattern: '^(G-[A-Z0-9]{6,12})?$', description: 'ID de medición de GA4' }
        pixel: { type: [string, 'null'], pattern: '^([0-9]{15,16})?$', description: 'ID del píxel de Meta' }
        feeds:
          type: object
          required: [gm, meta]
          properties:
            gm: { type: boolean, description: 'Cargó el feed en Google Merchant Center' }
            meta: { type: boolean, description: 'Cargó el feed en Meta Commerce Manager' }
    Conversiones:
      type: object
      required: [conectada, codigoPrueba, ultimoEnvio, ultimoError]
      properties:
        conectada: { type: boolean }
        codigoPrueba: { type: [string, 'null'] }
        ultimoEnvio: { type: [string, 'null'], format: date-time }
        ultimoError: { type: [string, 'null'], description: 'Lo que respondió Meta la última vez que rechazó una compra' }
    ConexionML:
      type: object
      required: [disponible, conectada, reautorizar, recargo, pausarSinStock, publicaciones, preguntas]
      properties:
        disponible: { type: boolean }
        conectada: { type: boolean }
        apodo: { type: string }
        desde: { type: string, format: date-time }
        reautorizar: { type: boolean }
        recargo: { type: integer }
        pausarSinStock: { type: boolean }
        publicaciones: { type: integer }
        preguntas: { type: integer, description: 'Sin responder' }
    PublicacionML:
      type: object
      required: [itemId, permalink]
      properties:
        itemId: { type: string }
        permalink: { type: string }
    ArcaConfig:
      type: object
      required: [conectada, cuit, razonSocial, condicion, puntoVenta, ambiente, certificado, certificadoVence, facturarAlCobrar]
      properties:
        conectada: { type: boolean, description: 'Tiene certificado cargado' }
        cuit: { type: string, description: '11 dígitos; vacío si nunca se configuró' }
        razonSocial: { type: string, maxLength: 64 }
        condicion: { type: string, description: 'monotributo | responsable_inscripto (vacío si nunca se configuró)' }
        puntoVenta: { type: integer, minimum: 0, maximum: 99998 }
        ambiente: { type: string, enum: [homologacion, produccion] }
        certificado: { type: boolean }
        certificadoVence: { type: [string, 'null'], format: date-time }
        facturarAlCobrar: { type: boolean }
    ArcaAlta:
      type: object
      required: [cuit, razonSocial, condicion, puntoVenta, ambiente]
      properties:
        cuit: { type: string, minLength: 11, maxLength: 13, description: 'Con o sin guiones; se valida el dígito verificador' }
        razonSocial: { type: string, minLength: 1, maxLength: 64 }
        condicion: { type: string, enum: [monotributo, responsable_inscripto] }
        puntoVenta: { type: integer, minimum: 1, maximum: 99998 }
        ambiente: { type: string, enum: [homologacion, produccion] }
    ArcaCertificado:
      type: object
      required: [cuit, alias, desde, vence, emisor, homologacion]
      properties:
        cuit: { type: string }
        alias: { type: string }
        desde: { type: string, format: date-time }
        vence: { type: string, format: date-time }
        emisor: { type: string }
        homologacion: { type: boolean }
    OrigenCorreo:
      type: object
      required: [cp, calle, altura, localidad, provincia]
      properties:
        cp: { type: string, description: '4 números' }
        calle: { type: string }
        altura: { type: string }
        piso: { type: string }
        depto: { type: string }
        localidad: { type: string }
        provincia: { type: string, description: 'Código de MiCorreo (una letra)' }
    PaqueteCorreo:
      type: object
      required: [peso, alto, ancho, largo]
      properties:
        peso: { type: integer, minimum: 1, maximum: 25000, description: 'Gramos por unidad' }
        alto: { type: integer, minimum: 1, maximum: 150 }
        ancho: { type: integer, minimum: 1, maximum: 150 }
        largo: { type: integer, minimum: 1, maximum: 150 }
    ConexionCorreo:
      type: object
      required: [disponible, pideCredenciales, pruebas, conectada, propias]
      properties:
        disponible: { type: boolean, description: 'Hay clave de cifrado: se puede conectar' }
        pideCredenciales: { type: boolean, description: 'Tu Local Web no tiene credenciales de API: la tienda trae las suyas' }
        pruebas: { type: boolean, description: 'Ambiente apitest' }
        conectada: { type: boolean }
        email: { type: string }
        cliente: { type: string, description: 'customerId de MiCorreo' }
        propias: { type: boolean, description: 'Usa credenciales de API propias' }
        desde: { type: string, format: date-time }
        origen: { $ref: '#/components/schemas/OrigenCorreo' }
        paquete: { $ref: '#/components/schemas/PaqueteCorreo' }
    AltaCorreo:
      type: object
      required: [email, clave, origen, paquete]
      properties:
        email: { type: string }
        clave: { type: string, description: 'Contraseña de MiCorreo: sólo para validar, no se guarda' }
        api:
          type: [object, 'null']
          properties: { usuario: { type: string }, clave: { type: string } }
        origen: { $ref: '#/components/schemas/OrigenCorreo' }
        paquete: { $ref: '#/components/schemas/PaqueteCorreo' }
    OpcionCorreo:
      type: object
      required: [precio, producto]
      properties:
        precio: { type: integer, description: 'Pesos enteros, redondeado para arriba' }
        producto: { type: string, description: 'Paq.ar Clásico' }
        diasMin: { type: string }
        diasMax: { type: string }
    CotizacionCorreo:
      type: object
      required: [domicilio, sucursal]
      properties:
        domicilio: { oneOf: [{ $ref: '#/components/schemas/OpcionCorreo' }, { type: 'null' }] }
        sucursal: { oneOf: [{ $ref: '#/components/schemas/OpcionCorreo' }, { type: 'null' }] }
    SucursalCorreo:
      type: object
      required: [codigo, nombre, direccion, localidad, cp, horario]
      properties:
        codigo: { type: string }
        nombre: { type: string }
        direccion: { type: string }
        localidad: { type: string }
        cp: { type: string }
        horario: { type: string, description: 'Lun a Vie 10:00 a 18:00 (vacío si no lo informa)' }
    EnvioCorreo:
      type: object
      required: [conectada, generado]
      properties:
        conectada: { type: boolean }
        generado: { type: boolean, description: 'Ya se dio de alta en MiCorreo' }
        tipo: { type: string, enum: [D, S] }
        sucursal: { type: string }
        importado: { type: string, format: date-time }
        seguimiento: { type: string }
    ConexionMP:
      type: object
      required: [disponible, conectada, reautorizar, cajaQR]
      properties:
        disponible: { type: boolean, description: 'La aplicación de Tu Local Web tiene credenciales' }
        conectada: { type: boolean }
        usuario: { type: string, description: 'user_id de la cuenta de Mercado Pago' }
        desde: { type: string, format: date-time }
        reautorizar: { type: boolean, description: 'El refresh falló: hay que volver a conectar' }
        cajaQR: { type: boolean }
    UbicacionMP:
      type: object
      required: [calle, numero, ciudad, provincia, latitud, longitud]
      properties:
        calle: { type: string, maxLength: 120 }
        numero: { type: string, maxLength: 20 }
        ciudad: { type: string, maxLength: 80 }
        provincia: { type: string, maxLength: 80 }
        latitud: { type: number }
        longitud: { type: number }
    CobroQR:
      type: object
      required: [referencia, qr, estado]
      properties:
        referencia: { type: string }
        qr: { type: string, description: 'qr_data para dibujar' }
        estado: { type: string }
    Dominios:
      type: object
      required: [gratis, dominios, registros]
      properties:
        gratis: { type: string, description: 'La dirección que viene con la tienda' }
        dominios:
          type: array
          items:
            type: object
            required: [nombre, detalle, estado, principal]
            properties:
              nombre: { type: string }
              detalle: { type: string }
              estado: { type: string, enum: [activo, verificando] }
              principal: { type: boolean }
              chequeos:
                type: array
                items:
                  type: object
                  required: [titulo, estado]
                  properties:
                    titulo: { type: string }
                    estado: { type: string, enum: [ok, esperando, pendiente] }
        registros:
          type: array
          items:
            type: object
            required: [tipo, nombre, valor]
            properties:
              tipo: { type: string }
              nombre: { type: string }
              valor: { type: string }
    PreferenciasAvisos:
      type: object
      required: [matriz, silencio, resumen]
      properties:
        matriz:
          type: object
          description: '"aviso:canal" → activo (los que no están, van por defecto)'
          additionalProperties: { type: boolean }
        silencio: { type: boolean }
        resumen: { type: string, enum: [whatsapp, email, off] }
    MisDatos:
      type: object
      required: [conteos, recientes, inactivos, borrado]
      properties:
        conteos:
          type: object
          required: [productos, clientes, pedidos, facturas, resenas, conversaciones]
          properties:
            productos: { type: integer }
            clientes: { type: integer }
            pedidos: { type: integer }
            facturas: { type: integer }
            resenas: { type: integer }
            conversaciones: { type: integer }
        recientes:
          type: array
          items:
            type: object
            required: [tipo, formato, en]
            properties:
              tipo: { type: string }
              formato: { type: string }
              en: { type: string, format: date-time }
        inactivos: { type: integer }
        borrado:
          type: [object, 'null']
          required: [clientes, el]
          properties:
            clientes: { type: integer }
            el: { type: string, format: date-time }
    Tablero:
      type: object
      description: >-
        Con montos en false (roles sin el permiso finanzas: Ventas y Local) no vienen los montos de dinero:
        ventas, serie, kpis.ticket, canales, meta, caja, liquidaciones, paraHacer.transferenciasMonto,
        enVivo.carritosMonto, hornero.carritosMonto, el total de ultimosPedidos ni la integración mp.
        Se omiten, no van en cero.
      required: [periodo, desde, hasta, hola, montos, kpis, avisos, ultimosPedidos, paraHacer, enVivo, hornero, bandeja, integraciones, masVendidos, resenas, envios]
      properties:
        periodo: { type: string, enum: [hoy, 7d, 30d] }
        desde: { type: string, format: date-time }
        hasta: { type: string, format: date-time }
        hola: { type: [string, 'null'], description: 'Nombre de pila de quien entra' }
        montos: { type: boolean, description: 'Si vienen los montos de dinero (false: el rol no ve finanzas)' }
        ventas: { $ref: '#/components/schemas/Comparado' }
        serie:
          type: object
          description: 'Ventas acumuladas en 14 tramos del período, y las del período anterior'
          required: [actual, anterior]
          properties:
            actual: { type: array, items: { type: number } }
            anterior: { type: array, items: { type: number } }
        kpis:
          type: object
          required: [pedidos, conversion, clientesNuevos]
          properties:
            pedidos: { $ref: '#/components/schemas/Comparado' }
            ticket: { $ref: '#/components/schemas/Comparado' }
            conversion: { $ref: '#/components/schemas/Comparado', description: 'Porcentaje (3.4 = 3,4 %): pedidos web por cada 100 visitas, por días' }
            clientesNuevos: { $ref: '#/components/schemas/Comparado' }
        canales:
          type: array
          description: 'Parte de las ventas del período por canal (web, wa, ml, ig, pos, tg), de mayor a menor'
          items:
            type: object
            required: [canal, parte]
            properties:
              canal: { type: string }
              parte: { type: number, description: 'De 0 a 1' }
        meta:
          type: object
          required: [objetivo, actual, proyeccion]
          properties:
            objetivo: { type: integer, description: '0: sin meta' }
            actual: { type: integer, description: 'Vendido en el mes' }
            proyeccion: { type: integer, description: 'Al ritmo actual, cómo cierra el mes' }
        avisos:
          type: object
          required: [certificadoDias]
          properties:
            certificadoDias: { type: [integer, 'null'], description: 'Días para que venza el certificado de ARCA, si hay que avisar' }
        ultimosPedidos:
          type: array
          items: { $ref: '#/components/schemas/PedidoBreve' }
        paraHacer:
          type: object
          required: [preparar, chats, chatMasViejoMin, transferencias, sinStock, sinStockEnMl]
          properties:
            preparar: { type: integer }
            chats: { type: integer }
            chatMasViejoMin: { type: integer }
            transferencias: { type: integer }
            transferenciasMonto: { type: integer }
            sinStock: { type: integer }
            sinStockEnMl: { type: integer }
        enVivo:
          type: object
          required: [personas, paginas, carritos]
          properties:
            personas: { type: integer }
            paginas:
              type: array
              items:
                type: object
                required: [nombre, personas]
                properties:
                  nombre: { type: string }
                  personas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
        caja:
          type: object
          required: [abierta, total, medios]
          properties:
            abierta: { type: [string, 'null'], format: date-time, description: 'Cuándo se abrió hoy (null: cerrada)' }
            total: { type: integer }
            medios:
              type: array
              items:
                type: object
                required: [medio, monto]
                properties:
                  medio: { type: string, description: 'efectivo, tarjeta, mp, modo, transf' }
                  monto: { type: integer }
        liquidaciones:
          type: array
          description: 'Lo que se acredita en los próximos 7 días, por medio de pago'
          items:
            type: object
            required: [medio, fecha, monto]
            properties:
              medio: { type: string }
              fecha: { type: string, format: date }
              monto: { type: integer }
        hornero:
          type: object
          required: [chatsHoy, ideas, carritos, costoMensaje, recordados, audiencia, ideasHechas]
          properties:
            chatsHoy: { type: integer }
            ideas: { type: integer }
            carritos: { type: integer }
            carritosMonto: { type: integer }
            costoMensaje: { type: integer, description: 'Lo que cuesta cada mensaje de WhatsApp' }
            recordados: { type: boolean, description: 'Ya se les mandó el recordatorio' }
            audiencia: { type: integer, description: 'Clientes que aceptan mensajes por WhatsApp' }
            ideasHechas:
              type: array
              description: 'Ideas de Hornero ya aprobadas (carritos, stock, promo)'
              items: { type: string }
        bandeja:
          type: array
          items:
            type: object
            required: [nombre, foto, mensaje, creado, atiende, sinLeer]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'], description: 'Id de la foto en Unsplash' }
              mensaje: { type: string }
              creado: { type: string, format: date-time }
              atiende: { type: string, enum: [hornero, vos] }
              sinLeer: { type: integer }
        integraciones:
          type: array
          description: 'Integraciones conectadas con su dato del momento'
          items:
            type: object
            required: [id, valor]
            properties:
              id: { type: string, description: 'mp (cobrado en 7 días), ml (publicaciones), wa (chats esperando), arca (días del certificado), andreani (envíos en camino)' }
              valor: { type: integer }
        masVendidos:
          type: array
          description: 'Los 4 más vendidos de los últimos 7 días'
          items:
            type: object
            required: [productoId, nombre, foto, unidades]
            properties:
              productoId: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              unidades: { type: integer }
        resenas:
          type: object
          required: [promedio, nuevas]
          properties:
            promedio: { type: [number, 'null'] }
            nuevas:
              type: array
              items:
                type: object
                required: [texto, autor, producto, canal, estrellas]
                properties:
                  texto: { type: string }
                  autor: { type: string }
                  producto: { type: string }
                  canal: { type: string }
                  estrellas: { type: integer }
        envios:
          type: object
          required: [paquetes, retiros]
          properties:
            paquetes: { type: integer }
            retiros:
              type: array
              items:
                type: object
                required: [hora, transporte, paquetes, ciudad, proximo]
                properties:
                  hora: { type: string, description: 'HH:MM' }
                  transporte: { type: string, enum: [andreani, oca, correo, moto] }
                  paquetes: { type: integer }
                  ciudad: { type: [string, 'null'], description: 'Si todos van a la misma ciudad' }
                  proximo: { type: boolean }
        visitas:
          type: object
          description: >-
            Visitas de la tienda online, medidas por Tu Local Web sin cookies (decisiones §36). Una visita es
            una persona distinta en un día: las de varios días se suman. Opcional: la demo no la trae.
          required: [desde, hoy, dias7, dias30, visitantes, vistas, paginas, masVistos]
          properties:
            desde: { type: [string, 'null'], format: date, description: 'Primer día con visitas (null: todavía ninguna)' }
            hoy: { $ref: '#/components/schemas/Comparado', description: 'Hoy contra ayer completo' }
            dias7: { $ref: '#/components/schemas/Comparado' }
            dias30: { $ref: '#/components/schemas/Comparado' }
            visitantes: { $ref: '#/components/schemas/Comparado', description: 'Visitas del período del tablero' }
            vistas: { $ref: '#/components/schemas/Comparado', description: 'Páginas vistas del período del tablero' }
            paginas:
              type: array
              items:
                type: object
                required: [pagina, vistas]
                properties:
                  pagina: { type: string, enum: [inicio, catalogo, producto, carrito, checkout] }
                  vistas: { type: integer }
            masVistos:
              type: array
              description: 'Los 5 productos más vistos del período'
              items:
                type: object
                required: [productoId, nombre, foto, vistas, visitantes]
                properties:
                  productoId: { type: string }
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  vistas: { type: integer }
                  visitantes: { type: integer }
    EstadoPedido:
      type: string
      enum: [Sin pagar, Para preparar, Listo para despachar, En camino, Entregado, Cancelado]
    PedidoFila:
      type: object
      required: [numero, cliente, foto, ciudad, canal, pago, envio, estado, total, creado, productos, cantidadProductos, vip, hornero, mayorista, telefono, codigo]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        ciudad: { type: string }
        canal: { type: string }
        pago: { type: string, description: 'mp, tarjeta, payway, modo, uala, transf, efectivo' }
        envio: { type: string, description: 'andreani, oca, correo, moto, retiro' }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer }
        creado: { type: string, format: date-time }
        productos:
          type: array
          description: 'Los primeros 3'
          items:
            type: object
            required: [nombre, foto]
            properties:
              nombre: { type: string }
              foto: { type: [string, 'null'] }
        cantidadProductos: { type: integer }
        vip: { type: boolean }
        hornero: { type: boolean, description: 'Lo vendió Hornero' }
        mayorista: { type: boolean }
        telefono: { type: [string, 'null'], description: 'El WhatsApp de quien compró, tal como lo cargó' }
        codigo: { type: [string, 'null'], description: 'Código público de la confirmación (/t/<tienda>/pedido/<codigo>, donde se deja la reseña); null si se cargó a mano' }
    ListaPedidos:
      type: object
      required: [total, suma, filas, etapas, facetas]
      properties:
        total: { type: integer, description: 'Pedidos que cumplen los filtros' }
        suma: { type: integer }
        filas: { type: array, items: { $ref: '#/components/schemas/PedidoFila' } }
        etapas:
          type: object
          description: 'Por estado, con todos los filtros salvo el de estado'
          additionalProperties: { type: integer }
        facetas:
          type: object
          description: 'Conteos de canal, pago y envío; cada uno sin su propio filtro'
          required: [canal, pago, envio]
          properties:
            canal: { type: object, additionalProperties: { type: integer } }
            pago: { type: object, additionalProperties: { type: integer } }
            envio: { type: object, additionalProperties: { type: integer } }
    PedidoDetalle:
      allOf:
        - { $ref: '#/components/schemas/PedidoFila' }
        - type: object
          required: [items, subtotal, costoEnvio, descuentos, comprador, estadoPago, factura, seguimiento, llega, nota, entrega, historial]
          properties:
            items:
              type: array
              items:
                type: object
                required: [productoId, nombre, foto, cantidad, precio, varianteId, variante]
                properties:
                  productoId: { type: [string, 'null'], description: 'El producto de la tienda; null en los pedidos de antes de guardarlo' }
                  nombre: { type: string }
                  foto: { type: [string, 'null'] }
                  cantidad: { type: integer }
                  precio: { type: integer }
                  varianteId: { type: [string, 'null'] }
                  variante: { type: [string, 'null'], description: 'Texto de la variante al comprar: "Talle M · Color Negro"' }
            subtotal: { type: integer }
            costoEnvio: { type: integer }
            descuentos:
              type: array
              description: 'Cada descuento por separado (cupón, transferencia): subtotal + envío − descuentos = total'
              items:
                type: object
                required: [concepto, monto]
                properties:
                  concepto: { type: string, description: '"Cupón VERANO10", "Descuento por transferencia"' }
                  monto: { type: integer }
            comprador:
              type: object
              required: [nombre, foto, telefono, email, desde, pedidos, gastado]
              properties:
                nombre: { type: string }
                foto: { type: [string, 'null'] }
                telefono: { type: [string, 'null'] }
                email: { type: [string, 'null'] }
                desde: { type: string, format: date-time }
                pedidos: { type: integer }
                gastado: { type: integer }
            estadoPago: { type: string, description: 'Aprobado, Acreditada, Pendiente, Cobrado' }
            factura: { type: [string, 'null'], description: 'B 0004-00000812' }
            seguimiento: { type: [string, 'null'] }
            llega: { type: [string, 'null'], format: date }
            nota: { type: [string, 'null'], description: 'Lo que anotó Hornero de la charla' }
            entrega:
              type: [object, 'null']
              description: 'Adónde se manda (para la etiqueta); null si retira o no se cargó'
              required: [direccion, cp]
              properties:
                direccion: { type: string }
                cp: { type: string }
                tipo: { type: string, enum: [D, S], description: 'Correo Argentino: domicilio o sucursal' }
                provincia: { type: string }
                localidad: { type: string }
                sucursal: { type: string }
                sucursalNombre: { type: string }
            sena: { $ref: '#/components/schemas/SenaPedido' }
            historial:
              type: array
              items:
                type: object
                required: [texto, cuando, hecho]
                properties:
                  texto: { type: string }
                  cuando: { type: [string, 'null'], format: date-time }
                  hecho: { type: boolean }
    PedidoBreve:
      type: object
      required: [numero, cliente, foto, canal, estado, creado]
      properties:
        numero: { type: integer }
        cliente: { type: string }
        foto: { type: [string, 'null'] }
        canal: { type: string }
        estado: { $ref: '#/components/schemas/EstadoPedido' }
        total: { type: integer, description: 'No viene sin montos' }
        creado: { type: string, format: date-time }
    Notificacion:
      type: object
      required: [id, tipo, titulo, detalle, creada, leida, grupo]
      properties:
        id: { type: string }
        tipo: { type: string, description: 'Marca o tipo del ícono (lib/marcas.ts): web, transf, mp, ml, warn, arca, star, ok, err' }
        titulo: { type: string }
        detalle: { type: string }
        creada: { type: string, format: date-time }
        leida: { type: boolean }
        grupo: { type: string, enum: [ventas, sistema] }
        ruta: { type: string, description: 'La página del panel que abre al tocarla (/panel/…)' }
    PaginaNotificaciones:
      type: object
      required: [notificaciones, sinLeer, siguiente]
      properties:
        notificaciones: { type: array, items: { $ref: '#/components/schemas/Notificacion' } }
        sinLeer: { type: integer, description: 'Cuántas no leyó (de todas, no sólo de esta página)' }
        siguiente: { type: [string, 'null'], description: 'Cursor de la página siguiente (null: no hay más)' }
    Onboarding:
      type: object
      required: [elecciones]
      properties:
        plantilla: { type: string, description: 'Una de las 16 del handoff' }
        elecciones: { type: object, additionalProperties: true, description: 'Objetivos, canales, secciones, cobros y envíos, tono, equipo (hasta 16 KB)' }
        terminado: { type: boolean }
    Consulta:
      type: object
      required: [nombre, email]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        whatsapp: { type: string, description: 'Con característica; se guardan sólo los dígitos' }
        web: { type: string, maxLength: 200 }
        facturacion: { type: string, enum: [empiezo, hasta-5, 5-a-20, 20-a-100, mas-de-100] }
        origen: { type: string, enum: [tiendanube, empretienda, mercadolibre, shopify, woocommerce, ninguna] }
        mensaje: { type: string, maxLength: 2000 }
    Postulacion:
      type: object
      required: [nombre, email, agencia]
      properties:
        nombre: { type: string, maxLength: 80 }
        email: { type: string }
        agencia: { type: string, maxLength: 120 }
        web: { type: string, maxLength: 200 }
        especialidades:
          type: array
          items: { type: string, enum: [diseno, desarrollo, marketing, contabilidad, fotografia] }
    NivelPartner: { type: string, enum: [partner, plata, oro] }
    EspecialidadPartner: { type: string, enum: [diseno, desarrollo, marketing, contabilidad, fotografia] }
    PerfilPartner:
      type: object
      required: [nombre, ciudad, descripcion, especialidades, casos, email, whatsapp, web, logo]
      properties:
        nombre: { type: string, maxLength: 80 }
        ciudad: { type: string, maxLength: 60 }
        descripcion: { type: string, maxLength: 280 }
        especialidades: { type: array, items: { $ref: '#/components/schemas/EspecialidadPartner' } }
        casos:
          type: array
          maxItems: 6
          items:
            type: object
            required: [nombre, url]
            properties:
              nombre: { type: string, maxLength: 60 }
              url: { type: string, description: 'https://' }
        email: { type: string }
        whatsapp: { type: string, description: 'Sólo dígitos, con característica' }
        web: { type: string, description: 'https:// o vacío' }
        logo: { type: string, description: 'URL https:// de la imagen, o vacío' }
    CobroPartner:
      type: object
      required: [tipo, valor, titular, cuit, condicionIva]
      properties:
        tipo: { type: string, enum: [cbu, alias], description: 'CBU/CVU (22 dígitos con verificadores) o alias de Mercado Pago o del banco' }
        valor: { type: string }
        titular: { type: string, maxLength: 80 }
        cuit: { type: string, description: '11 dígitos con verificador' }
        condicionIva: { type: string, enum: [monotributo, responsable_inscripto, exento] }
    TiendaReferida:
      type: object
      required: [id, nombre, slug, plan, ciclo, estado, alta, finComision, comisionMes]
      properties:
        id: { type: string }
        nombre: { type: string }
        slug: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        ciclo: { type: string, enum: [mes, anio] }
        estado: { type: string, enum: [prueba, activa, gratis, baja] }
        alta: { type: string, format: date }
        finComision: { type: string, format: date, description: 'Primer día del mes en que deja de generar comisión (12 meses desde el alta)' }
        comisionMes: { type: integer, description: 'En pesos: % del nivel sobre lo que paga por mes; 0 si no está activa o pasaron los 12 meses' }
    PagoPartner:
      type: object
      required: [mes, estado, monto, detalle, facturaUrl, fechaPago, pagadoEn]
      properties:
        mes: { type: string, description: 'YYYY-MM' }
        estado: { type: string, enum: [pendiente, aprobada, pagada] }
        monto: { type: integer, description: 'En pesos' }
        detalle:
          type: array
          items:
            type: object
            required: [tiendaId, tienda, plan, comision]
            properties:
              tiendaId: { type: string }
              tienda: { type: string }
              plan: { $ref: '#/components/schemas/Plan' }
              comision: { type: integer }
        facturaUrl: { type: [string, 'null'] }
        fechaPago: { type: string, format: date, description: 'El 10 del mes siguiente' }
        pagadoEn: { type: [string, 'null'], format: date }
    PanelPartner:
      type: object
      required: [hoy, partner, tiendas, clics, pagos, colaboraciones]
      properties:
        hoy: { type: string, format: date }
        partner:
          type: object
          required: [nombre, email, nivel, nivelEfectivo, porcentaje, codigo, cupon, aprobadoEn, perfil, cobro]
          properties:
            nombre: { type: string }
            email: { type: string }
            nivel: { $ref: '#/components/schemas/NivelPartner' }
            nivelEfectivo: { $ref: '#/components/schemas/NivelPartner' }
            porcentaje: { type: integer }
            codigo: { type: string, description: 'El ref del link (/empezar?ref=…)' }
