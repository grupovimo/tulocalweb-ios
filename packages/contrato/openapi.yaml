            properties:
              id: { type: string }
              nombre: { type: string }
              foto: { type: [string, 'null'] }
              cantidad: { type: integer }
              variante: { type: [string, 'null'] }
        envio: { type: boolean }
        retiro: { type: boolean }
        agotado: { type: boolean, description: 'Tiene cupo y está lleno' }
    AltaSuscripcion:
      type: object
      required: [planId, email, nombre, telefono, entrega, direccion, cp]
