      required: [codigo, planId, plan, foto, incluye, precio, frecuencia, nombre, entrega, direccion, estado, proximoCobro, cobros, creadaEn, tienda, whatsapp]
      properties:
        codigo: { type: string }
        planId: { type: string }
        plan: { type: string }
        foto: { type: [string, 'null'] }
        incluye: { type: string }
        precio: { type: integer }
        frecuencia: { $ref: '#/components/schemas/FrecuenciaSuscripcion' }
        nombre: { type: string, description: 'Sólo el primer nombre' }
        entrega: { type: string, enum: [envio, retiro] }
        direccion: { type: string }
        estado: { $ref: '#/components/schemas/EstadoSuscripcion' }
        proximoCobro: { type: [string, 'null'], format: date-time }
        cobros: { type: integer }
        creadaEn: { type: string, format: date-time }
        tienda: { type: string }
        whatsapp: { type: string }
    Problema:
