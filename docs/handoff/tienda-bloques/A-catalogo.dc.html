<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vidriera · Catálogo almacén</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E2A22}a:hover{color:#2F5D45}
.vA{font-family:'Figtree',system-ui,sans-serif;color:#1E2A22;background:#F4F3EE}
.vA *{box-sizing:border-box}
.dA{font-family:'Fraunces',Georgia,serif;font-weight:400;letter-spacing:-0.02em;margin:0}
.eA{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0}
</style>
</helmet>
<div class="vA" style="width:1440px;padding-bottom:120px">

  <header style="height:84px;padding:0 56px;display:flex;align-items:center;gap:40px;border-bottom:1px solid #DAD8CE">
    <a href="#" class="dA" style="font-size:30px;text-decoration:none">Almacén Verde</a>
    <form style="flex:1;display:flex;align-items:center;gap:12px;height:48px;border:1px solid #1E2A22;padding:0 16px;background:#FFFFFF" role="search">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="qA" style="position:absolute;left:-9999px">Buscar</label>
      <input id="qA" value="sin tacc" style="flex:1;border:0;font:16px 'Figtree';outline:none;background:transparent;color:#1E2A22">
      <button type="button" aria-label="Borrar búsqueda" style="border:0;background:transparent;font-size:18px;cursor:pointer;color:#5E6A61">×</button>
    </form>
    <nav style="display:flex;gap:28px;font-size:15px;font-weight:500"><a href="#" style="text-decoration:none">Nosotros</a><a href="#" style="text-decoration:none">Pedido (3)</a></nav>
  </header>

  <div style="padding:48px 56px 0">
    <p style="margin:0;font-size:14px;color:#5E6A61"><a href="#" style="color:#5E6A61">Inicio</a> / Buscar</p>
    <div style="display:flex;justify-content:space-between;align-items:end;margin-top:20px">
      <h1 class="dA" style="font-size:56px;line-height:1">8 resultados para «sin tacc»</h1>
      <label style="display:flex;align-items:center;gap:12px;font-size:15px">Ordenar
        <select style="height:44px;border:1px solid #1E2A22;background:#FFFFFF;font:500 15px 'Figtree';padding:0 14px;color:#1E2A22"><option>Más vendidos</option><option>Menor precio</option><option>Novedades</option></select>
      </label>
    </div>
    <div style="display:flex;gap:8px;margin-top:24px">
      <sc-for list="{{activos}}" as="f" hint-placeholder-count="2"><button type="button" style="height:36px;padding:0 14px;border:1px solid #1E2A22;background:#1E2A22;color:#F4F3EE;font:500 14px 'Figtree';display:flex;gap:8px;align-items:center;cursor:pointer">{{f}} <span aria-hidden="true">×</span></button></sc-for>
      <button type="button" style="height:36px;padding:0 6px;border:0;background:transparent;font:600 14px 'Figtree';text-decoration:underline;cursor:pointer;color:#1E2A22">Limpiar filtros</button>
    </div>
  </div>

  <div style="padding:40px 56px 0;display:grid;grid-template-columns:260px 1fr;gap:56px">
    <aside style="display:flex;flex-direction:column;gap:36px">
      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px">
        <legend class="eA" style="margin-bottom:14px">Categoría</legend>
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
          <label style="display:flex;justify-content:space-between;font-size:15px;cursor:pointer"><span style="display:flex;gap:10px;align-items:center"><input type="checkbox" checked="{{c.on}}" style="width:18px;height:18px;accent-color:#2F5D45">{{c.n}}</span><span style="color:#5E6A61">{{c.k}}</span></label>
        </sc-for>
      </fieldset>
      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px">
        <legend class="eA" style="margin-bottom:14px">Precio</legend>
        <div style="display:flex;gap:8px"><input aria-label="Mínimo" placeholder="$ mín." style="width:100%;height:44px;border:1px solid #C9C7BC;padding:0 12px;font:15px 'Figtree'"><input aria-label="Máximo" placeholder="$ máx." style="width:100%;height:44px;border:1px solid #C9C7BC;padding:0 12px;font:15px 'Figtree'"></div>
      </fieldset>
      <fieldset style="border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:12px">
        <legend class="eA" style="margin-bottom:14px">Mostrar</legend>
        <label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" checked style="width:18px;height:18px;accent-color:#2F5D45">Sólo con stock</label>
        <label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" style="width:18px;height:18px;accent-color:#2F5D45">En oferta</label>
        <label style="display:flex;gap:10px;align-items:center;font-size:15px"><input type="checkbox" style="width:18px;height:18px;accent-color:#2F5D45">Precio por mayor</label>
      </fieldset>
      <div style="padding:24px;background:#E6E9E0;display:flex;flex-direction:column;gap:10px">
        <p style="margin:0;font-weight:600;font-size:15px">¿Comprás por cantidad?</p>
        <p style="margin:0;font-size:14px;line-height:1.5;color:#3F4B43">Desde 5 kg por producto tenés precio mayorista.</p>
        <a href="#" style="font-weight:600;font-size:14px">Ver la lista</a>
      </div>
    </aside>

    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 24px;align-content:start">
      <sc-for list="{{prods}}" as="p" hint-placeholder-count="8">
        <article style="display:flex;flex-direction:column;gap:12px">
          <div style="position:relative">
            <img src="{{p.foto}}" alt="{{p.nombre}}" style="width:100%;aspect-ratio:1;object-fit:cover;display:block">
            <sc-if value="{{p.off}}" hint-placeholder-val="{{false}}"><span style="position:absolute;top:10px;left:10px;background:#2F5D45;color:#FFFFFF;font-size:12px;font-weight:600;padding:5px 9px">{{p.off}}</span></sc-if>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px">
            <a href="#" style="font-size:16px;font-weight:500;text-decoration:none">{{p.nombre}}</a>
            <span style="font-size:14px;color:#5E6A61">{{p.detalle}}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto">
            <span style="font-size:17px;font-weight:600">{{p.precio}}</span>
            <button type="button" style="height:40px;padding:0 16px;border:1px solid #1E2A22;background:transparent;font:600 14px 'Figtree';cursor:pointer;color:#1E2A22">Agregar</button>
          </div>
        </article>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      activos: ['Sólo con stock', 'Orgánicos'],
      cats: [{ n: 'Frutos secos', k: 3, on: false }, { n: 'Almacén', k: 4, on: false }, { n: 'Orgánicos', k: 4, on: true }, { n: 'Aceites', k: 1, on: false }],
      prods: [
        { nombre: 'Almendras Non Pareil', detalle: '500 g · peladas', precio: '$ 9.400', off: '', foto: '/_blob/99cbe4b99f40f1bc13236f90a41fe800' },
        { nombre: 'Harina integral agroecológica', detalle: '1 kg · molino de piedra', precio: '$ 2.900', off: '−15 %', foto: '/_blob/b471b62c89fab9b8f86694407bcbb4de' },
        { nombre: 'Arroz yamaní', detalle: '1 kg · orgánico', precio: '$ 3.600', off: '', foto: '/_blob/c19c15babc2046c733d48a38619419a5' },
        { nombre: 'Garbanzos', detalle: '1 kg · a granel', precio: '$ 3.200', off: '', foto: '/_blob/d3261b4694d823c8ad552d0adf32d7d6' },
        { nombre: 'Avena arrollada', detalle: '1 kg · gruesa', precio: '$ 2.400', off: '', foto: '/_blob/62dd14b5785df07ed227175c3b856a9f' },
        { nombre: 'Aceite de oliva extra virgen', detalle: '500 ml · Mendoza', precio: '$ 14.800', off: '', foto: '/_blob/055fa183366ce2923490f5ce910de5ba' },
        { nombre: 'Maní tostado sin sal', detalle: '500 g', precio: '$ 2.100', off: '−10 %', foto: '/_blob/011aea524ccecc45d277e4db67594859' },
        { nombre: 'Yerba orgánica misionera', detalle: '1 kg · con palo', precio: '$ 6.900', off: '', foto: '/_blob/48a313fae55814c6dc1cb566aa92bf16' }
      ]
    };
  }
}
</script>
</body>
</html>
