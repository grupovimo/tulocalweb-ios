<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Biblioteca de bloques</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.lb{font-family:'Geist',system-ui,sans-serif;color:#1A1A18;background:#F4F2EE}
.lb *{box-sizing:border-box}
.mi{width:100%;height:132px;border-radius:8px;background:#FFFFFF;border:1px solid #E2DFD8;padding:10px;display:flex;gap:6px;overflow:hidden;position:relative}
.im{background:#D7D3CA;border-radius:4px}
.ln{height:6px;border-radius:3px;background:#3A3936}
.ls{height:5px;border-radius:3px;background:#B9B5AC}
.bt{height:12px;width:44px;border-radius:3px;background:#3A3936}
</style>
</helmet>
<div class="lb" style="width:1440px;padding:56px">
  <h1 style="margin:0;font-size:40px;font-weight:700;letter-spacing:-0.03em">Bloques y variantes</h1>
  <p style="margin:10px 0 0;font-size:17px;color:#55534D;max-width:900px;line-height:1.5">El dueño arma cada página sumando bloques. Cada bloque tiene variantes de diseño y toma los colores, la tipografía y la forma de botones de la dirección elegida. Si un bloque no tiene datos, no se dibuja y el editor avisa qué falta.</p>

  <sc-for list="{{grupos}}" as="g" hint-placeholder-count="5">
    <section style="margin-top:48px">
      <div style="display:flex;align-items:baseline;gap:14px;border-bottom:2px solid #1A1A18;padding-bottom:10px"><h2 style="margin:0;font-size:26px;font-weight:700;letter-spacing:-0.02em">{{g.n}}</h2><span style="font-size:15px;color:#55534D">{{g.d}}</span></div>
      <sc-for list="{{g.bloques}}" as="b" hint-placeholder-count="3">
        <div style="display:grid;grid-template-columns:240px 1fr;gap:24px;padding:20px 0;border-bottom:1px solid #DCD8D0">
          <div><p style="margin:0;font-size:17px;font-weight:600">{{b.n}}</p><p style="margin:6px 0 0;font-size:14px;color:#55534D;line-height:1.45">{{b.d}}</p></div>
          <div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px">
            <sc-for list="{{b.v}}" as="v" hint-placeholder-count="3">
              <figure style="margin:0;display:flex;flex-direction:column;gap:6px">
                <div class="mi">
                  <sc-if value="{{v.foto}}" hint-placeholder-val="{{false}}"><div class="im" style="position:absolute;inset:10px"></div><div style="position:absolute;left:20px;bottom:20px;display:flex;flex-direction:column;gap:5px;width:50%"><div class="ln" style="background:#FFFFFF;height:8px"></div><div class="ln" style="background:#FFFFFF;width:70%"></div><div class="bt" style="background:#FFFFFF"></div></div></sc-if>
                  <sc-if value="{{v.partido}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px"><div class="ln" style="height:9px"></div><div class="ln" style="width:70%"></div><div class="ls" style="width:85%"></div><div class="bt" style="margin-top:4px"></div></div><div class="im" style="flex:1"></div></sc-if>
                  <sc-if value="{{v.collage}}" hint-placeholder-val="{{false}}"><div style="flex:1.2;background:#3A3936;border-radius:4px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px"><div class="ln" style="background:#FFFFFF"></div><div class="bt" style="background:#E7B04A;width:36px"></div></div><div class="im" style="flex:1"></div><div style="flex:.8;display:flex;flex-direction:column;gap:6px"><div class="im" style="flex:1"></div><div style="flex:1;background:#E7B04A;border-radius:4px"></div></div></sc-if>
                  <sc-if value="{{v.texto}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px"><div class="ln" style="width:80%;height:10px"></div><div class="ln" style="width:55%;height:10px"></div><div class="ls" style="width:60%"></div><div class="bt"></div></div></sc-if>
                  <sc-if value="{{v.carrusel}}" hint-placeholder-val="{{false}}"><div class="im" style="flex:1"></div><div style="position:absolute;bottom:16px;left:0;right:0;display:flex;justify-content:center;gap:4px"><span style="width:14px;height:4px;border-radius:2px;background:#3A3936"></span><span style="width:4px;height:4px;border-radius:2px;background:#8B887F"></span><span style="width:4px;height:4px;border-radius:2px;background:#8B887F"></span></div><span style="position:absolute;left:14px;top:56px;font-size:14px;color:#3A3936">‹</span><span style="position:absolute;right:14px;top:56px;font-size:14px;color:#3A3936">›</span></sc-if>
                  <sc-if value="{{v.banda}}" hint-placeholder-val="{{false}}"><div style="flex:1;background:#3A3936;border-radius:6px;padding:14px;display:flex;align-items:center;justify-content:space-between"><div style="display:flex;flex-direction:column;gap:5px;width:55%"><div class="ln" style="background:#FFFFFF;height:9px"></div><div class="ls" style="background:#8B887F"></div></div><div class="bt" style="background:#E7B04A"></div></div></sc-if>
                  <sc-if value="{{v.contador}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div style="display:flex;gap:4px;align-items:center"><div class="ln" style="width:40%"></div><span style="margin-left:auto;width:16px;height:14px;background:#3A3936;border-radius:3px"></span><span style="width:16px;height:14px;background:#3A3936;border-radius:3px"></span><span style="width:16px;height:14px;background:#3A3936;border-radius:3px"></span></div><div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px"><div class="im"></div><div class="im"></div><div class="im"></div><div class="im"></div></div></div></sc-if>
                  <sc-if value="{{v.barra}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="height:18px;background:#3A3936;border-radius:3px;display:flex;align-items:center;justify-content:center"><div class="ls" style="width:50%;background:#FFFFFF"></div></div><div style="height:16px;border-bottom:1px solid #E2DFD8"></div><div class="im" style="flex:1;opacity:.5"></div></div></sc-if>
                  <sc-if value="{{v.dos}}" hint-placeholder-val="{{false}}"><div class="im" style="flex:1;position:relative"></div><div style="flex:1;background:#3A3936;border-radius:4px"></div></sc-if>
                  <sc-if value="{{v.iconos}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:center"><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:20px;height:20px;border-radius:6px;border:2px solid #3A3936"></span><div class="ls" style="width:80%"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:20px;height:20px;border-radius:6px;border:2px solid #3A3936"></span><div class="ls" style="width:80%"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:20px;height:20px;border-radius:6px;border:2px solid #3A3936"></span><div class="ls" style="width:80%"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span style="width:20px;height:20px;border-radius:6px;border:2px solid #3A3936"></span><div class="ls" style="width:80%"></div></div></div></sc-if>
                  <sc-if value="{{v.grilla}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:grid;grid-template-columns:repeat({{v.cols}},1fr);gap:5px"><sc-for list="{{v.celdas}}" as="c" hint-placeholder-count="4"><div style="display:flex;flex-direction:column;gap:4px"><div class="im" style="flex:1"></div><div class="ls"></div><div class="ln" style="width:50%;height:5px"></div></div></sc-for></div></sc-if>
                  <sc-if value="{{v.look}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:5px"><div class="im"></div><div class="im"></div><div class="im"></div><div style="border:2px solid #3A3936;border-radius:4px;display:flex;flex-direction:column;justify-content:flex-end;padding:5px;gap:4px"><div class="ln" style="width:70%"></div><div class="bt" style="width:100%;height:9px"></div></div></div></sc-if>
                  <sc-if value="{{v.lista}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:6px;align-items:center;height:30px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><div class="ln" style="width:55%"></div><div class="ls" style="width:80%"></div></div><div class="im" style="width:30px;height:30px"></div></div><div style="display:flex;gap:6px;align-items:center;height:30px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><div class="ln" style="width:45%"></div><div class="ls" style="width:70%"></div></div><div class="im" style="width:30px;height:30px"></div></div><div style="display:flex;gap:6px;align-items:center;height:30px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><div class="ln" style="width:60%"></div><div class="ls" style="width:75%"></div></div><div class="im" style="width:30px;height:30px"></div></div></div></sc-if>
                  <sc-if value="{{v.mapa}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:5px"><div class="ln" style="height:8px"></div><div class="ls"></div><div class="ls" style="width:70%"></div><div class="ls" style="width:80%"></div></div><div style="flex:1.2;border-radius:4px;background:#E6E1D6;background-image:linear-gradient(#FFFFFF 3px,transparent 3px),linear-gradient(90deg,#FFFFFF 3px,transparent 3px);background-size:26px 26px;position:relative"><span style="position:absolute;left:45%;top:35%;width:12px;height:12px;border-radius:50% 50% 50% 0;background:#3A3936;transform:rotate(-45deg)"></span></div></sc-if>
                  <sc-if value="{{v.acordeon}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;gap:0"><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #E2DFD8"><div class="ln" style="width:60%"></div><span style="font-size:10px">−</span></div><div class="ls" style="width:85%;margin:6px 0"></div><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #E2DFD8"><div class="ln" style="width:50%"></div><span style="font-size:10px">+</span></div><div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #E2DFD8"><div class="ln" style="width:65%"></div><span style="font-size:10px">+</span></div></div></sc-if>
                  <sc-if value="{{v.tarjetas}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:5px"><div style="border:1px solid #E2DFD8;border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:4px"><div class="ls" style="width:50%;background:#E7B04A"></div><div class="ln" style="height:5px"></div><div class="ls"></div><div class="ls" style="width:60%"></div></div><div style="border:1px solid #E2DFD8;border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:4px"><div class="ls" style="width:50%;background:#E7B04A"></div><div class="ln" style="height:5px"></div><div class="ls"></div><div class="ls" style="width:60%"></div></div><div style="border:1px solid #E2DFD8;border-radius:4px;padding:6px;display:flex;flex-direction:column;gap:4px"><div class="ls" style="width:50%;background:#E7B04A"></div><div class="ln" style="height:5px"></div><div class="ls"></div><div class="ls" style="width:60%"></div></div></div></sc-if>
                  <sc-if value="{{v.logos}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;align-items:center"><div class="ls" style="width:40%"></div><div style="display:flex;gap:10px;width:100%;justify-content:center"><span style="width:30px;height:12px;background:#8B887F;border-radius:2px"></span><span style="width:24px;height:12px;background:#8B887F;border-radius:6px"></span><span style="width:34px;height:12px;background:#8B887F;border-radius:2px"></span><span style="width:26px;height:12px;background:#8B887F;border-radius:2px"></span></div></div></sc-if>
                  <sc-if value="{{v.input}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px"><div class="ln" style="width:60%;height:8px"></div><div class="ls" style="width:45%"></div><div style="display:flex;gap:4px;width:70%"><div style="flex:1;height:14px;border:1px solid #8B887F;border-radius:3px"></div><div class="bt" style="width:30px;height:14px"></div></div></div></sc-if>
                  <sc-if value="{{v.circulos}}" hint-placeholder-val="{{false}}"><div style="flex:1;display:flex;justify-content:space-around;align-items:center"><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span class="im" style="width:40px;height:40px;border-radius:50%"></span><div class="ls" style="width:30px"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span class="im" style="width:40px;height:40px;border-radius:50%"></span><div class="ls" style="width:30px"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span class="im" style="width:40px;height:40px;border-radius:50%"></span><div class="ls" style="width:30px"></div></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><span class="im" style="width:40px;height:40px;border-radius:50%"></span><div class="ls" style="width:30px"></div></div></div></sc-if>
                  <sc-if value="{{v.video}}" hint-placeholder-val="{{false}}"><div class="im" style="flex:1;display:flex;align-items:center;justify-content:center;background:#8B887F"><span style="width:30px;height:30px;border-radius:50%;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:12px">▶</span></div></sc-if>
                </div>
                <figcaption style="font-size:13px;font-weight:500;color:#3A3936">{{v.n}}</figcaption>
              </figure>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4200}}'>
class Component extends DCLogic {
  renderVals() {
    const V = (n, tipo, extra) => Object.assign({ n, [tipo]: true }, extra || {});
    const G = (n, cols, k) => V(n, 'grilla', { cols, celdas: Array.from({ length: k }, (_, i) => i) });
    return {
      grupos: [
        { n: 'Portada', d: 'Lo primero que se ve. Una por página.', bloques: [
          { n: 'Portada', d: 'Título, frase y hasta dos botones. Sin foto, usa el color de la marca.', v: [V('Foto completa', 'foto'), V('Partida', 'partido'), V('Collage', 'collage'), V('Sólo texto', 'texto'), V('Carrusel', 'carrusel')] }
        ] },
        { n: 'Promos', d: 'Para vender más esta semana.', bloques: [
          { n: 'Banner', d: 'Una promo con foto o color, texto y botón a donde quieras.', v: [V('Banda', 'banda'), V('Con foto', 'foto'), V('Doble', 'dos')] },
          { n: 'Oferta con cuenta regresiva', d: 'Toma los productos en oferta y la fecha de fin.', v: [V('Con productos', 'contador'), V('Banda', 'banda')] },
          { n: 'Barra de anuncios', d: 'Arriba de todo, con varios mensajes que rotan.', v: [V('Fija', 'barra'), V('Rotativa', 'barra')] }
        ] },
        { n: 'Marca', d: 'Contar quién está detrás.', bloques: [
          { n: 'Texto con imagen', d: 'Historia, el taller, el equipo.', v: [V('Imagen a la derecha', 'partido'), V('Imagen de fondo', 'foto'), V('Sólo texto', 'texto')] },
          { n: 'Video', d: 'De YouTube, Instagram o subido.', v: [V('Ancho completo', 'video'), V('Con texto', 'partido')] },
          { n: 'Beneficios', d: 'Envío, cuotas, cambios, retiro. Salen de la configuración de la tienda.', v: [V('Fila con íconos', 'iconos'), V('Tarjetas', 'tarjetas')] }
        ] },
        { n: 'Venta guiada', d: 'Llevar a la gente al producto.', bloques: [
          { n: 'Productos', d: 'Elegidos a mano, más vendidos, novedades u ofertas. La grilla se arma según cuántos hay.', v: [G('Grilla de 4', 4, 4), G('Grilla de 3', 3, 3), V('Carrusel', 'carrusel'), V('Lista', 'lista')] },
          { n: 'Producto destacado', d: 'Uno solo, grande, con botón de compra.', v: [V('Partido', 'partido'), V('Foto completa', 'foto')] },
          { n: 'Combo / completá el look', d: 'Varios productos que se agregan juntos con descuento.', v: [V('Con tarjeta de precio', 'look')] },
          { n: 'Categorías', d: 'Con la foto que elijas o la del primer producto.', v: [G('Tarjetas', 3, 3), V('Círculos', 'circulos'), V('Lista', 'lista')] },
          { n: 'Menú para pedir', d: 'Para gastronomía: secciones, foto chica y + para agregar.', v: [V('Lista', 'lista'), G('Dos columnas', 2, 4)] }
        ] },
        { n: 'Local y confianza', d: 'Lo que da tranquilidad para comprar.', bloques: [
          { n: 'Local', d: 'Dirección, mapa, horarios, cómo llegar y WhatsApp.', v: [V('Con mapa', 'mapa'), V('Tarjeta', 'tarjetas')] },
          { n: 'Reseñas', d: 'Sólo con compra verificada. Promedio con un decimal.', v: [V('Tarjetas', 'tarjetas'), V('Carrusel', 'carrusel'), V('Cita grande', 'texto')] },
          { n: 'Preguntas frecuentes', d: 'Las respuestas que más das por WhatsApp.', v: [V('Acordeón', 'acordeon')] },
          { n: 'Logos', d: 'Prensa, marcas que vendés o con quién trabajás.', v: [V('Fila', 'logos')] },
          { n: 'Galería / Instagram', d: 'Siempre llena filas completas.', v: [G('6 en fila', 6, 6), G('Mosaico', 3, 6)] },
          { n: 'Newsletter', d: 'Junta emails con un cupón opcional.', v: [V('Centrado', 'input'), V('Banda', 'banda')] }
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
