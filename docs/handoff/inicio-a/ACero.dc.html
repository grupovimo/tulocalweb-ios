<!doctype html>
<html lang="es">
<head>

<title>Inicio A2 · Día en cero</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#B0441D}a:hover{color:#8E3A16}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F7F1EA; color: #2A140C; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;">

  <div style="position: relative; overflow: hidden; padding: 58px 20px 24px; background: {{tienda}}; color: #FFFFFF; border-radius: 0 0 34px 34px; display: flex; flex-direction: column; gap: 16px;">
    <svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.22; mix-blend-mode: overlay;"><filter id="granoA2"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence></filter><rect width="100%" height="100%" filter="url(#granoA2)"></rect></svg>
    <div aria-hidden="true" style="position: absolute; right: -60px; top: -40px; width: 240px; height: 240px; border-radius: 120px; background: {{tiendaClaro}}; opacity: 0.18;"></div>

    <div style="position: relative; display: flex; align-items: center; gap: 12px;">
      <span style="width: 48px; height: 48px; border-radius: 16px; background: #FFFFFF; color: {{tienda}}; font-size: 22px; font-weight: 900; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,0,0,0.18);">S</span>
      <span style="flex: 1; display: flex; flex-direction: column;">
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.4px;">Sintética</span>
        <span style="font-size: 14px; opacity: 0.9; display: flex; align-items: center; gap: 6px;"><span style="width: 8px; height: 8px; border-radius: 4px; background: #8EF0BF;"></span>Abierta · 23 visitas hoy</span>
      </span>
      <button aria-label="Avisos" style="width: 42px; height: 42px; border-radius: 21px; border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.14); color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg></button>
    </div>

    <div style="position: relative; display: flex; flex-direction: column; gap: 4px;">
      <span style="font-size: 15px; opacity: 0.9;">Hola, Nahuel</span>
      <span style="font-size: 30px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1;">Tu local está abierto. Hoy te visitaron 23 personas.</span>
    </div>

    <div role="img" aria-label="Visitas por hora hoy" style="position: relative; display: flex; flex-direction: column; gap: 4px;">
      <div style="display: flex; align-items: flex-end; gap: 5px; height: 48px;">
        <sc-for list="{{visitas}}" as="h" hint-placeholder-count="14"><span style="flex: 1; height: {{h.alto}}; border-radius: 4px; background: {{h.color}};"></span></sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; opacity: 0.8;"><span>8 h</span><span>12 h</span><span>16 h</span><span>20 h</span></div>
    </div>

    <a href="#" style="position: relative; height: 58px; border-radius: 20px; background: #FFFFFF; color: {{tiendaTinta}}; font-size: 18px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; box-shadow: 0 10px 24px rgba(0,0,0,0.22);"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4"></path><path d="M6 12v7h12v-7"></path></svg>Compartir tu vidriera</a>
  </div>

  <div style="padding: 18px 20px 120px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <sc-for list="{{acciones}}" as="a" hint-placeholder-count="3">
        <a href="#" style="border-radius: 20px; padding: 12px; height: 92px; box-sizing: border-box; background: #FFFFFF; box-shadow: 0 1px 0 #EADFD3, 0 6px 14px rgba(42,20,12,0.06); text-decoration: none; color: #2A140C; display: flex; flex-direction: column; justify-content: space-between;">
          <span style="width: 36px; height: 36px; border-radius: 12px; background: {{tiendaClaro}}; color: {{tiendaTinta}}; display: flex; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.icono}}"></path></svg></span>
          <span style="display: flex; flex-direction: column;"><span style="font-size: 15px; font-weight: 800;">{{a.titulo}}</span><span style="font-size: 12px; color: #6B5244;">{{a.sub}}</span></span>
        </a>
      </sc-for>
    </div>

    <section style="background: #FFFFFF; border-radius: 22px; padding: 16px; box-shadow: 0 1px 0 #EADFD3, 0 6px 14px rgba(42,20,12,0.06); display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;"><h2 style="margin: 0; font-size: 19px; font-weight: 800;">Para tu primera venta</h2><span style="font-size: 14px; font-weight: 700; color: {{tiendaTinta}};">2 de 4</span></div>
      <div style="height: 8px; border-radius: 4px; background: #F0E7DD; overflow: hidden;"><div style="width: 50%; height: 100%; background: {{tienda}}; border-radius: 4px;"></div></div>
      <sc-for list="{{pasos}}" as="p" hint-placeholder-count="4">
        <a href="#" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #2A140C;">
          <span style="width: 26px; height: 26px; border-radius: 13px; flex: none; background: {{p.fondo}}; color: #FFFFFF; border: 2px solid {{p.borde}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900;">{{p.marca}}</span>
          <span style="flex: 1; font-size: 16px; font-weight: 600; color: {{p.color}};">{{p.texto}}</span>
          <span style="font-size: 14px; font-weight: 700; color: {{tiendaTinta}};">{{p.accion}}</span>
        </a>
      </sc-for>
    </section>
  </div>

  <nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FBF7F2; border-top: 1px solid #EADFD3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-top: 8px; box-sizing: border-box;">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; text-decoration: none; color: {{tiendaTinta}};"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg>Inicio</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; text-decoration: none; color: #6B5244;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Pedidos</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; text-decoration: none; color: #6B5244;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M4 7.5l8 4.5 8-4.5M12 12v9"></path></svg>Productos</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; text-decoration: none; color: #6B5244;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 18l1.5-3.5A7 7 0 1 1 9.5 18z"></path></svg>Tincho</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; text-decoration: none; color: #6B5244;"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg>Más</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tienda":{"editor":"color","default":"#D9652F","options":["#5B6B3A","#1F4E5A","#7A2E3A","#D9652F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  mezclar(hex, con, t) {
    const a = parseInt(hex.slice(1), 16), b = parseInt(con.slice(1), 16);
    const c = [16, 8, 0].map(s => Math.round(((a >> s) & 255) * (1 - t) + ((b >> s) & 255) * t));
    return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
  }
  renderVals() {
    const t = this.props.tienda ?? '#D9652F';
    const claro = this.mezclar(t, '#FFFFFF', 0.84), tinta = this.mezclar(t, '#000000', 0.3);
    const alturas = [6, 10, 8, 18, 22, 30, 26, 40, 34, 46, 0, 0, 0, 0];
    return {
      tienda: t, tiendaClaro: claro, tiendaTinta: tinta,
      visitas: alturas.map((h, i) => ({ alto: Math.max(h, 4) + 'px', color: i < 10 ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.22)' })),
      acciones: [
        { titulo: 'Producto', sub: 'Sacale una foto', icono: 'M4 8h3l1.5-2h7L17 8h3v11H4z M12 9.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7' },
        { titulo: 'Vender', sub: 'En el local', icono: 'M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2 M8 9v6M11 9v6M14 9v6M16.5 9v6' },
        { titulo: 'Cobrar', sub: 'Link o QR', icono: 'M10 14a4 4 0 0 0 6 0l3-3a4 4 0 0 0-6-6l-1 1 M14 10a4 4 0 0 0-6 0l-3 3a4 4 0 0 0 6 6l1-1' }
      ],
      pasos: [
        { marca: '✓', texto: 'Cargar tu primer producto', accion: '', fondo: '#3FA877', borde: '#3FA877', color: '#6B5244' },
        { marca: '✓', texto: 'Elegir el color de tu local', accion: '', fondo: '#3FA877', borde: '#3FA877', color: '#6B5244' },
        { marca: '', texto: 'Conectar Mercado Pago', accion: 'Conectar', fondo: '#FFFFFF', borde: '#D8C9BB', color: '#2A140C' },
        { marca: '', texto: 'Mandar el link a 5 clientes', accion: 'Compartir', fondo: '#FFFFFF', borde: '#D8C9BB', color: '#2A140C' }
      ]
    };
  }
}
</script>
</body>
</html>
