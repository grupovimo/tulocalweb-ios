# El proyecto de Xcode sale de acá: `xcodegen generate` (el .xcodeproj no se versiona).
name: TuLocalWeb
options:
  bundleIdPrefix: ar.com.tulocalweb
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: M6935MSNQB
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  TuLocalWeb:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/TuLocalWeb.xcconfig
      Release: Config/TuLocalWeb.xcconfig
    sources:
      - path: TuLocalWeb
      - path: Compartido
    dependencies:
      - target: TuLocalWebWidgets
    entitlements:
      path: TuLocalWeb/TuLocalWeb.entitlements
      properties:
        # development en Debug (lo instalado desde Xcode), production en Release.
        aps-environment: $(APS_ENTORNO)
        # La sesión, compartida con los widgets y la Live Activity.
        keychain-access-groups:
          - $(AppIdentifierPrefix)ar.com.tulocalweb.app
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.tulocalweb.app
        PRODUCT_NAME: TuLocalWeb
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          APS_ENTORNO: development
        Release:
          APS_ENTORNO: production
          # TestFlight por GitHub Actions con firma manual (testflight.yml): un perfil por target.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.tulocalweb.app App Store
    info:
      path: TuLocalWeb/Info.plist
      properties:
        CFBundleDisplayName: Tu Local Web
        CFBundleDevelopmentRegion: es-AR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLWApi: $(TLW_API)
        TLWGrupoLlavero: $(AppIdentifierPrefix)ar.com.tulocalweb.app
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          # tulocalweb://pedido/{numero} y tulocalweb://producto/{id} (push, widgets, Siri).
          - CFBundleURLName: ar.com.tulocalweb.app.enlaces
            CFBundleURLSchemes: [tulocalweb]
          # La vuelta del ingreso con Google por Clerk.
          - CFBundleURLName: ar.com.tulocalweb.app
            CFBundleURLSchemes: [ar.com.tulocalweb.app]
        UIAppFonts:
          - InstrumentSans-Regular.ttf
          - InstrumentSans-Medium.ttf
          - InstrumentSans-SemiBold.ttf
          - InstrumentSans-Bold.ttf
        UILaunchScreen:
          UIColorName: Fondo
          UIImageName: Lanzamiento
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Para entrar a tu tienda y confirmar las acciones sensibles, como cancelar un pedido."
        NSCameraUsageDescription: "Para sacarles fotos a tus productos y escanear códigos."
        NSPhotoLibraryAddUsageDescription: "Para guardar en tus fotos la imagen de tu tienda para estados e historias."
        LSApplicationQueriesSchemes: [whatsapp]
        NSAppTransportSecurity:
          # Sólo para probar contra la API local (http://127.0.0.1:4000) en el simulador.
          NSAllowsLocalNetworking: true
  TuLocalWebWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/TuLocalWeb.xcconfig
      Release: Config/TuLocalWeb.xcconfig
    sources:
      - path: TuLocalWebWidgets
      - path: Compartido
    entitlements:
      path: TuLocalWebWidgets/TuLocalWebWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)ar.com.tulocalweb.app
    info:
      path: TuLocalWebWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tu Local Web
        CFBundlePackageType: XPC!
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        TLWApi: $(TLW_API)
        TLWGrupoLlavero: $(AppIdentifierPrefix)ar.com.tulocalweb.app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ar.com.tulocalweb.app.Widgets
        PRODUCT_NAME: TuLocalWebWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: ar.com.tulocalweb.app.Widgets App Store
  TuLocalWebTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TuLocalWebTests]
    dependencies:
      - target: TuLocalWeb
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TuLocalWeb:
    build:
      targets:
        TuLocalWeb: all
        TuLocalWebTests: [test]
    test:
      targets: [TuLocalWebTests]
