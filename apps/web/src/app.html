<!doctype html>
<html lang="es-AR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#FBF7F2" />
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- Quien ya eligió cookies no ve el banner (que llega en el HTML, así pinta enseguida). -->
		<script>
			try {
				// Sólo una elección válida (como leerEleccion): 'all', 'nec' o {an, mk}.
				var c = localStorage.getItem('tlw-cookies') || localStorage.getItem('mostrador-cookies');
				var ok = c === 'all' || c === 'nec';
				if (!ok && c) {
					var o = JSON.parse(c);
					ok = !!o && typeof o === 'object' && !Array.isArray(o);
				}
				if (ok) document.documentElement.dataset.cookies = '1';
			} catch (e) {}
			// Android: el pedido para instalar el panel (sólo el panel tiene manifest) llega temprano; se
			// guarda para el botón «Instalar» del panel (lib/panel/app-celular.svelte.ts).
			addEventListener('beforeinstallprompt', function (e) {
				e.preventDefault();
				window.__tlwInstalar = e;
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
